/* Clinical accent theme: drug identity colors remain consistent. */
:root{--blue:#164aa2;--accent:#0a8f9b;--card:#f2f5fa;--card2:#e4ebf5}
.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#f9fbff 0%,#edf4ff 72%,#ddebf8 100%);border-color:#a2b7d5;box-shadow:0 12px 30px #14345e16}
.hero:before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,#2563eb 0%,#7c3aed 25%,#d97706 48%,#0f766e 74%,#be185d 100%)}
.hero h1{color:#143c76}.eyebrow{color:#146976}.chip{background:#dbe8ff;color:#214f91;border:1px solid #b7cdf1}.chip:nth-child(2){background:#e9e0fa;color:#61379b;border-color:#cdb5ea}.chip:nth-child(3){background:#d8eee9;color:#166556;border-color:#a9d6ca}.chip:nth-child(4){background:#f8e8ce;color:#855214;border-color:#e2c59b}
.panel{box-shadow:0 7px 20px #19355709;border-color:#a7b9d1}
.panel h2:not(.footer-title){border-left:5px solid #1b66bf;padding-left:12px;color:#183e70}
.nav{gap:9px}.nav button{background:linear-gradient(160deg,#f9fbff,#dbe4f0);border:1px solid #a6bbd8;padding:10px 15px;box-shadow:0 3px 0 #8a9fba45;transition:background .15s,box-shadow .15s}
.nav button.active{background:linear-gradient(125deg,#183c71,#145c86);border-color:#1b4d80;box-shadow:0 4px 12px #163c7040;border-bottom:3px solid #54cfce}
.nav .ico svg{width:39px;height:39px;overflow:visible}.ico{flex-shrink:0}.drug-button{box-shadow:0 3px 0 #132b4b18}.drug-button.chosen{box-shadow:0 4px 9px #1b365127}
.band th{background:linear-gradient(90deg,#1e497e,#365e91);color:white;font-weight:800;border-color:#345880}
.qg{background:#d0eadb!important;color:#0d5030;border-top:3px solid #329964}.qw{background:#f6e4bb!important;color:#6f4710;border-top:3px solid #d19628}.qb{background:#f3d4dc!important;color:#85253e;border-top:3px solid #c34d6b}
.case{border-left:4px solid var(--caseaccent,#2563eb);background:linear-gradient(145deg,#f4f8fe,#e1e9f5)}.case .number{background:var(--caseaccent,#2563eb);box-shadow:0 3px 6px #233c5c22}.case .action{color:#194577}
.highlight{background:#dfebff;border-left-color:#2563eb}.highlight.warning{background:#fff0ce;border-left-color:#d18a19;color:#735015}
.status.ok{background:#cdebd9;color:#145331;border:1px solid #92c8a9}.status.warn{background:#ffe4ab;color:#73460d;border:1px solid #daba7c}.status.avoid,.status.contra{background:#fad4dc;color:#902d46;border:1px solid #da9fae}
.score{background:linear-gradient(120deg,#195cad,#0d7b87);box-shadow:0 4px 10px #163f6925}.footer-title{color:#1e497e;border-bottom:2px solid #afc7e6;padding-bottom:9px}.result-table .dose-display{color:#154b83}
@media(max-width:550px){.nav .ico svg{width:33px;height:33px}.nav button{padding:9px 10px;gap:6px}.hero h1{font-size:27px}}
@media print{.hero:before{display:none}.band th{background:#dde5ef;color:#172f50}.nav .ico svg{width:24px;height:24px}.panel{box-shadow:none}}

rexat liều cao: cân nhắc tạm ngừng PPI. Kiểm tra nhãn thuốc phụ thuộc pH.", "Rilpivirine: contraindicated. High-dose methotrexate: consider withholding PPI. Check pH-dependent drug labels."], "refs": [1, 2, 3, 4, 5]}, {"text": ["Rilpivirin: chống chỉ định. Methotrexat liều cao: cân nhắc tạm ngừng PPI. Kiểm tra nhãn thuốc phụ thuộc pH.", "Rilpivirine: contraindicated. High-dose methotrexate: consider withholding PPI. Check pH-dependent drug labels."], "refs": [1, 2, 3, 4, 5]}, {"text": ["Rilpivirin: chống chỉ định. Methotrexat liều cao: cân nhắc tạm ngừng PPI. Kiểm tra nhãn thuốc phụ thuộc pH.", "Rilpivirine: contraindicated. High-dose methotrexate: consider withholding PPI. Check pH-dependent drug labels."], "refs": [1, 2, 3, 4, 5]}]}, {"g": 4, "label": ["Dùng qua ống nuôi ăn", "Feeding tube use"], "cells": [{"text": ["Chọn chế phẩm/hạt phù hợp; không nghiền lớp bao.", "Use suitable preparation/granules; preserve enteric coating."], "refs": [1]}, {"text": ["Nhãn có hướng dẫn qua ống cho nang/cốm; đúng dung môi và kích thước ống.", "Label has capsule/granule tube instructions; use specified vehicle and tube size."], "refs": [2]}, {"text": ["SoluTab có hướng dẫn phân tán và qua ống; không nhai vi hạt.", "SoluTab has dispersion/tube instructions; do not chew microgranules."], "refs": [3]}, {"text": ["Viên không nghiền; cốm PROTONIX có quy trình riêng.", "Do not crush tablets; PROTONIX granules have a specific procedure."], "refs": [4]}, {"text": ["Viên ACIPHEX phải nuốt nguyên; không tự nghiền để qua ống.", "Swallow ACIPHEX tablets whole; do not crush for tube administration."], "refs": [5]}]}], "groups": [["Tất cả tiêu chí", "All criteria"], ["Dược lý & PK/PD", "Pharmacology & PK/PD"], ["Liều người lớn", "Adult doses"], ["Dân số đặc biệt", "Special populations"], ["Tương tác & thực hành", "Interactions & practice"]], "evidence": [{"name": "Esomeprazol / lành EE", "title": ["Lợi ích có thật, mức tăng tuyệt đối nhỏ", "Real benefit, small absolute gain"], "design": ["Phân tích gộp 10 RCT; n=15.316; đánh giá lành nội soi sau 8 tuần.", "Meta-analysis of 10 RCTs; n=15,316; endoscopic healing at 8 weeks."], "result": ["RR lành EE 1,05 (KTC 95% 1,02–1,08); tăng tuyệt đối khoảng 4 điểm %; NNT=25.", "EE healing RR 1.05 (95% CI 1.02–1.08); absolute gain about 4 percentage points; NNT=25."], "limit": ["Dữ liệu 1995–2005, khác biệt liều/thiết kế; chỉ đọc tóm tắt. Không suy ra ưu thế toàn bộ chỉ định hoặc an toàn.", "1995–2005 data, dose/design differences; abstract reviewed. Does not establish superiority across indications or safety."], "refs": [16]}, {"name": "COGENT", "title": ["Lợi ích tiêu hóa; chưa loại trừ nguy cơ tim mạch", "GI benefit; cardiovascular harm not excluded"], "design": ["RCT mù đôi; 3.873 ngẫu nhiên hóa, 3.761 phân tích; aspirin + clopidogrel; kết cục tại 180 ngày.", "Double-blind RCT; 3,873 randomized, 3,761 analyzed; aspirin + clopidogrel; 180-day outcomes."], "result": ["Biến cố tiêu hóa gộp: 1,1% so với 2,9%; HR 0,34 (0,18–0,63), p<0,001. NNT≈56, tự tính từ chênh lệch 1,8 điểm %. Tim mạch: HR 0,99 (0,68–1,44), p=0,96.", "Composite GI events: 1.1% vs 2.9%; HR 0.34 (0.18–0.63), p<0.001. NNT≈56, calculated from 1.8-point absolute difference. Cardiovascular: HR 0.99 (0.68–1.44), p=0.96."], "limit": ["Dừng sớm do mất tài trợ; KTC tim mạch rộng; tóm tắt đã đối chiếu. “Không có ý nghĩa thống kê” không chứng minh tương đương an toàn. Vẫn theo cảnh báo nhãn.", "Stopped early after loss of funding; wide cardiovascular CI; abstract verified. Nonsignificance does not establish equivalent safety. Follow label warnings."], "refs": [14, 1, 2]}, {"name": "COMPASS / pantoprazol", "title": ["An toàn dài hạn: diễn giải đúng giới hạn", "Long-term safety: interpret limitations"], "design": ["RCT mù đôi, thiết kế giai thừa một phần; n=17.598; pantoprazol 40 mg/ngày so với giả dược; trung vị 3,01 năm.", "Double-blind partial factorial RCT; n=17,598; pantoprazole 40 mg/day vs placebo; median 3.01 years."], "result": ["Nhiễm trùng đường ruột 1,4% so với 1,0%; OR 1,33 (KTC 95% 1,01–1,75). NNH≈250, tự tính từ tỷ lệ làm tròn; không thấy khác biệt có ý nghĩa ở nhiều kết cục khác.", "Enteric infections 1.4% vs 1.0%; OR 1.33 (95% CI 1.01–1.75). NNH≈250, calculated from rounded rates; no significant difference for many other outcomes."], "limit": ["Chỉ đọc tóm tắt; bệnh tim mạch ổn định, một PPI, khoảng 3 năm; không loại trừ ADR hiếm hoặc nguy cơ dài hơn. NNH không lấy bằng nghịch đảo OR.", "Abstract reviewed; stable cardiovascular disease, one PPI, about 3 years; rare events and longer-term risks remain possible. NNH is not the inverse of OR."], "refs": [21]}], "scenarios": [{"title": ["Clopidogrel + cần bảo vệ tiêu hóa", "Clopidogrel + GI protection needed"], "action": ["Cân nhắc pantoprazol; tránh omeprazol/esomeprazol theo nhãn.", "Consider pantoprazole; avoid omeprazole/esomeprazole per label."], "why": ["Ức chế CYP2C19 ảnh hưởng hoạt hóa clopidogrel. COGENT giảm biến cố tiêu hóa nhưng không đủ loại trừ nguy cơ tim mạch. Không bỏ bảo vệ tiêu hóa khi có chỉ định rõ.", "CYP2C19 inhibition affects clopidogrel activation. COGENT reduced GI events but cannot exclude cardiovascular risk. Preserve indicated gastroprotection."], "refs": [1, 2, 4, 14]}, {"title": ["GERD chưa đáp ứng", "Inadequate GERD response"], "action": ["Kiểm tra tuân thủ và thời điểm uống; đánh giá lại chẩn đoán trước khi tăng liều liên tục.", "Check adherence and meal timing; reassess diagnosis before repeated escalation."], "why": ["PPI thường tối ưu trước ăn 30–60 phút; NEXIUM theo nhãn ≥1 giờ. Có thể thử đổi một PPI; không có bằng chứng cho chuỗi đổi nhiều thuốc. Triệu chứng kháng trị cần nội soi/đo trào ngược theo bệnh cảnh.", "Usually optimize 30–60 min before meals; NEXIUM label ≥1 h. One PPI switch may be tried; repeated serial switches lack evidence. Refractory symptoms warrant contextual endoscopy/reflux testing."], "refs": [15, 2]}, {"title": ["Viêm thực quản nặng / CYP2C19", "Severe EE / CYP2C19"], "action": ["Esomeprazol có lợi ích lành EE nhỉnh hơn; rabeprazol ít phụ thuộc CYP2C19 hơn về cơ chế.", "Esomeprazole offers a modest EE healing benefit; rabeprazole has less CYP2C19 dependence mechanistically."], "why": ["Không đồng nhất “ít phụ thuộc” với “không phụ thuộc”. CPIC có khuyến cáo kiểu hình cho omeprazol/lansoprazol/pantoprazol; chưa khuyến cáo chỉnh theo gen cho esomeprazol/rabeprazol. Không suy kiểu gen từ dân tộc.", "Less dependence does not mean independence. CPIC gives phenotype advice for omeprazole/lansoprazole/pantoprazole, but not esomeprazole/rabeprazole. Do not infer genotype from ethnicity."], "refs": [5, 16, 17]}, {"title": ["H. pylori", "H. pylori"], "action": ["Ưu tiên phác đồ đúng và ức chế acid đủ; PPI dùng 2 lần/ngày trong phác đồ bốn thuốc bismuth tối ưu.", "Prioritize the correct regimen and adequate acid suppression; PPI twice daily within optimized bismuth quadruple therapy."], "why": ["ACG 2024: 14 ngày; không mặc định dùng bộ ba clarithromycin nếu chưa chứng minh nhạy cảm. VNAGE cũng ưu tiên phác đồ bismuth 14 ngày. Xác nhận tiệt trừ ≥4 tuần sau kháng sinh; ngừng PPI ≥2 tuần trước xét nghiệm.", "ACG 2024: 14 days; do not default to clarithromycin triple therapy without demonstrated susceptibility. VNAGE also favors 14-day bismuth therapy. Confirm eradication ≥4 weeks after antibiotics; stop PPI ≥2 weeks before testing."], "refs": [18, 8]}, {"title": ["Xuất huyết do loét sau nội soi", "Ulcer bleeding after endoscopy"], "action": ["PPI liều cao sau cầm máu nội soi, truyền liên tục hoặc ngắt quãng theo phác đồ có bằng chứng.", "High-dose PPI after endoscopic hemostasis, continuous or intermittent per evidence-based protocol."], "why": ["ACG: 3 ngày liều cao, sau đó uống 2 lần/ngày đến 2 tuần sau nội soi. Nhãn NEXIUM IV: 80 mg/30 phút → 8 mg/giờ; tổng 72 giờ gồm liều đầu. Suy gan A/B: 6 mg/giờ; C: 4 mg/giờ. Không áp dụng cho xuất huyết do giãn tĩnh mạch như đơn trị.", "ACG: high dose for 3 days, then oral twice daily through 2 weeks after endoscopy. NEXIUM IV label: 80 mg/30 min → 8 mg/h; total 72 h includes loading. Hepatic A/B: 6 mg/h; C: 4 mg/h. Not monotherapy for variceal bleeding."], "refs": [12, 10]}, {"title": ["Suy thận / suy gan / đa thuốc", "Renal / hepatic impairment / polypharmacy"], "action": ["Không chỉnh liều thường quy theo thận; suy gan phải theo từng nhãn và chỉ định.", "No routine renal dose adjustment; hepatic dosing must follow label and indication."], "why": ["Không cần nhập creatinin để tạo độ chính xác giả. Theo dõi viêm thận kẽ cấp, hạ Mg, tương tác pH, methotrexat liều cao. Pantoprazol vẫn có tương tác do pH dù ảnh hưởng CYP2C19 lên clopidogrel ít hơn.", "Creatinine inputs would imply false precision. Monitor acute interstitial nephritis, low Mg, pH interactions, high-dose methotrexate. Pantoprazole still has pH interactions despite less CYP2C19 impact on clopidogrel."], "refs": [1, 2, 3, 4, 5, 7]}, {"title": ["Dự phòng stress ở hồi sức", "Stress ulcer prophylaxis in ICU"], "action": ["Chỉ định theo nguy cơ; PPI hoặc thuốc kháng H2 theo hướng dẫn hồi sức.", "Use risk-based indications; PPI or H2 blocker per ICU guidance."], "why": ["SCCM/ASHP 2024 nêu rối loạn đông máu, sốc, bệnh gan mạn là yếu tố nguy cơ. Ngừng dự phòng khi hết chỉ định, trước chuyển khỏi ICU nếu không còn lý do khác. Không tự áp phác đồ truyền liều cao điều trị chảy máu để dự phòng.", "SCCM/ASHP 2024 identifies coagulopathy, shock and chronic liver disease as risks. Stop prophylaxis when no longer indicated, before ICU transfer if no other reason. Do not use high-dose bleeding treatment infusions for prophylaxis."], "refs": [19]}, {"title": ["PPI kéo dài / giảm kê đơn", "Long-term PPI / deprescribing"], "action": ["Rà soát chỉ định, giảm về liều thấp nhất hiệu quả; thường cân nhắc từ 2 lần xuống 1 lần/ngày.", "Review indications, use lowest effective dose; often consider stepping down twice to once daily."], "why": ["Không ngừng thường quy khi GERD biến chứng hoặc nguy cơ xuất huyết cao. Có thể giảm dần hoặc ngừng trực tiếp nếu phù hợp; giải thích tăng tiết acid hồi ứng. Không diễn giải liên hệ quan sát với CKD/sa sút trí tuệ như quan hệ nhân quả đã chứng minh.", "Do not routinely stop in complicated GERD or high bleeding risk. Tapering or abrupt withdrawal may be appropriate; explain rebound acid. Observational links with CKD/dementia are not proven causality."], "refs": [20, 21]}], "notes": [["Nhãn uống Hoa Kỳ [1–5] là nguồn chính; SmPC Anh [7] chỉ áp dụng chế phẩm được dẫn. Chưa xác minh nhãn từng biệt dược đang lưu hành tại Việt Nam.", "US oral labels [1–5] are primary; UK SmPC [7] applies to the referenced product. Individual Vietnamese marketed-product labels are unverified."], ["PPI được hoạt hóa trong môi trường acid tại tế bào viền rồi ức chế H+/K+-ATPase; bán thải huyết tương ngắn không đồng nghĩa tác dụng ngắn. Không có thuốc đảo ngược đặc hiệu dùng thường quy.", "PPIs are acid-activated in parietal cells and inhibit H+/K+-ATPase; short plasma half-life does not imply short action. No routine specific reversal agent."], ["Liều trong bảng là liều theo nguồn cho người lớn, không phải liều tương đương trên mọi chỉ định. Thiếu chỉ định trong nhãn đã đọc không đồng nghĩa thuốc không hiệu quả hoặc không được dùng theo hướng dẫn.", "Table doses are source-specific adult doses, not universally equivalent. An absent indication in a reviewed label does not mean lack of efficacy or guideline use."], ["OE = liều mg × hệ số hiệu lực acid; là mô hình kết cục pH dạ dày, không phải thuật toán đổi đơn. Không ngoại suy tuyến tính đến liều ngoài nghiên cứu hoặc so trực tiếp 1 lần/ngày với 2 lần/ngày.", "OE = mg dose × acid-potency factor; a gastric-pH model, not a prescription conversion algorithm. Do not extrapolate linearly beyond studied doses or directly compare once- with twice-daily regimens."], ["Công cụ không tính CrCl vì liều PPI thường không dựa CrCl. Suy gan, thai kỳ, tương tác hoặc phác đồ xuất huyết cần đọc ghi chú; trạng thái màu không phải mức chứng cứ.", "No CrCl calculation because PPI dosing is generally not CrCl-based. Read notes for liver disease, pregnancy, interactions or bleeding regimens; colors are not evidence grades."], ["ADR cần chú ý: đau đầu/tiêu chảy; viêm thận kẽ cấp; hạ Mg; thiếu B12; nhiễm C. difficile; lupus và phản ứng da nặng; nguy cơ gãy xương và polyp tuyến đáy vị theo cảnh báo nhãn. Không xếp hạng ADR giữa thuốc từ báo cáo tự nguyện.", "Relevant ADRs: headache/diarrhea, acute interstitial nephritis, hypomagnesemia, B12 deficiency, C. difficile, lupus/severe skin reactions; label warnings include fractures and fundic gland polyps. Spontaneous reports cannot rank agents."], ["Theo dõi Mg khi điều trị kéo dài hoặc phối hợp lợi tiểu/digoxin; xét nghiệm B12/chức năng thận theo nguy cơ và triệu chứng. Khi không có yếu tố nguy cơ, không tự động yêu cầu mọi bệnh nhân làm xét nghiệm định kỳ.", "Consider Mg monitoring for prolonged treatment or diuretic/digoxin use; B12/renal testing based on risks and symptoms. Do not mandate blanket routine testing without risk factors."], ["Thai kỳ: dữ liệu đoàn hệ và phân tích anh chị em giảm lo ngại gây quái thai lớn, nhưng không chứng minh mọi PPI hoàn toàn an toàn. Cho con bú cần kiểm tra riêng nhãn và tình trạng trẻ.", "Pregnancy: cohort/sibling analyses reduce concern for major teratogenicity but do not establish complete safety of every PPI. Lactation requires product-specific and infant assessment."], ["EBM đã đối chiếu tóm tắt bài gốc cho các nghiên cứu [14,16,21]; chưa thẩm định toàn bộ phụ lục, tài trợ và nguy cơ sai lệch từng RCT trong phân tích gộp.", "EBM summaries [14,16,21] were checked against original abstracts; full supplements, funding and individual RCT bias have not all been appraised."], ["Đối chiếu ngày 11/10/2026. Nguồn có năm riêng; không gọi tất cả là hướng dẫn 2026. Chưa xác minh được hướng dẫn Bộ Y tế chuyên biệt so sánh 5 PPI.", "Checked 11 Oct 2026. Sources retain their own publication years; not all are 2026 guidelines. A Ministry of Health guideline specifically comparing these five PPIs is unverified."], ["Không lưu dữ liệu người bệnh; công cụ chạy tại trình duyệt và không gửi thông số ra máy chủ. Liên kết tài liệu sẽ mở trang nguồn khi người dùng chọn.", "No patient data storage; calculations run locally and do not transmit inputs. Reference links open source sites only when selected."]], "gloss": [{"abbr": "P-gp / BCRP", "full": "P-glycoprotein / breast cancer resistance protein", "meaning": ["Các chất vận chuyển; chưa thẩm định để so sánh định lượng", "Drug transporters; no quantitative comparative appraisal"]}, {"abbr": "PPI", "full": "Proton pump inhibitor", "meaning": ["Thuốc ức chế bơm proton", "Proton pump inhibitor"]}, {"abbr": "PK / PD", "full": "Pharmacokinetics / Pharmacodynamics", "meaning": ["Dược động học / dược lực học", "Pharmacokinetics / pharmacodynamics"]}, {"abbr": "AUC", "full": "Area under the concentration–time curve", "meaning": ["Diện tích dưới đường cong nồng độ–thời gian", "Area under the concentration–time curve"]}, {"abbr": "Cmax / Tmax", "full": "Maximum concentration / time to maximum concentration", "meaning": ["Nồng độ đỉnh / thời gian đạt đỉnh", "Peak concentration / time to peak"]}, {"abbr": "CYP2C19 / CYP3A4 / CYP3A", "full": "Cytochrome P450 enzymes", "meaning": ["Các enzym chuyển hóa thuốc", "Drug-metabolizing enzymes"]}, {"abbr": "ATPase", "full": "Adenosine triphosphatase", "meaning": ["Enzym thủy phân ATP; bơm H+/K+ là đích PPI", "ATP-hydrolyzing enzyme; H+/K+ pump is the PPI target"]}, {"abbr": "GERD", "full": "Gastroesophageal reflux disease", "meaning": ["Bệnh trào ngược dạ dày–thực quản", "Gastroesophageal reflux disease"]}, {"abbr": "EE", "full": "Erosive esophagitis", "meaning": ["Viêm thực quản trợt", "Erosive esophagitis"]}, {"abbr": "ZES", "full": "Zollinger–Ellison syndrome", "meaning": ["Hội chứng Zollinger–Ellison", "Zollinger–Ellison syndrome"]}, {"abbr": "NSAID", "full": "Nonsteroidal anti-inflammatory drug", "meaning": ["Thuốc chống viêm không steroid", "Nonsteroidal anti-inflammatory drug"]}, {"abbr": "OE", "full": "Omeprazole equivalents", "meaning": ["Mg omeprazol tương đương về ức chế acid trong mô hình", "Mg omeprazole equivalents in acid-suppression model"]}, {"abbr": "CrCl", "full": "Creatinine clearance", "meaning": ["Độ thanh thải creatinin", "Creatinine clearance"]}, {"abbr": "CKD", "full": "Chronic kidney disease", "meaning": ["Bệnh thận mạn", "Chronic kidney disease"]}, {"abbr": "ADR", "full": "Adverse drug reaction", "meaning": ["Phản ứng có hại của thuốc", "Adverse drug reaction"]}, {"abbr": "RCT", "full": "Randomized controlled trial", "meaning": ["Thử nghiệm ngẫu nhiên có đối chứng", "Randomized controlled trial"]}, {"abbr": "EBM", "full": "Evidence-based medicine", "meaning": ["Y học dựa trên bằng chứng", "Evidence-based medicine"]}, {"abbr": "RR / HR / OR", "full": "Risk ratio / hazard ratio / odds ratio", "meaning": ["Tỷ số nguy cơ / tỷ số nguy cơ tức thời / tỷ số chênh", "Risk ratio / hazard ratio / odds ratio"]}, {"abbr": "KTC / CI", "full": "Confidence interval", "meaning": ["Khoảng tin cậy", "Confidence interval"]}, {"abbr": "NNT / NNH", "full": "Number needed to treat / harm", "meaning": ["Số người cần điều trị để có thêm một lợi ích / tác hại", "Number treated for one additional benefit / harm"]}, {"abbr": "ACG / AGA", "full": "American College of Gastroenterology / American Gastroenterological Association", "meaning": ["Các hội chuyên ngành tiêu hóa Hoa Kỳ", "US gastroenterology societies"]}, {"abbr": "CPIC", "full": "Clinical Pharmacogenetics Implementation Consortium", "meaning": ["Liên minh triển khai dược di truyền lâm sàng", "Clinical pharmacogenetics implementation consortium"]}, {"abbr": "VNAGE", "full": "Vietnam Association of Gastroenterology", "meaning": ["Hội Khoa học Tiêu hóa Việt Nam", "Vietnam Association of Gastroenterology"]}, {"abbr": "SCCM / ASHP", "full": "Society of Critical Care Medicine / American Society of Health-System Pharmacists", "meaning": ["Hội hồi sức / hội dược sĩ hệ thống y tế Hoa Kỳ", "US critical care / health-system pharmacy societies"]}, {"abbr": "ICU / IV", "full": "Intensive care unit / intravenous", "meaning": ["Đơn vị hồi sức / đường tĩnh mạch", "Intensive care / intravenous"]}, {"abbr": "FDA / SmPC", "full": "Food and Drug Administration / Summary of Product Characteristics", "meaning": ["Cơ quan quản lý thuốc Hoa Kỳ / tóm tắt đặc tính sản phẩm", "US drug regulator / product characteristics"]}, {"abbr": "COGENT / COMPASS", "full": "Clopidogrel and the Optimization of Gastrointestinal Events Trial / Cardiovascular Outcomes for People Using Anticoagulation Strategies", "meaning": ["Tên thử nghiệm; không phải so sánh trực tiếp 5 PPI", "Trial names; not head-to-head comparisons of five PPIs"]}, {"abbr": "Mg / B12", "full": "Magnesium / vitamin B12", "meaning": ["Magnesi / vitamin B12", "Magnesium / vitamin B12"]}, {"abbr": "H. pylori / C. difficile", "full": "Helicobacter pylori / Clostridioides difficile", "meaning": ["Các vi khuẩn liên quan bệnh dạ dày / tiêu chảy nhiễm trùng", "Bacteria involved in gastric disease / infectious diarrhea"]}, {"abbr": "GI / H2", "full": "Gastrointestinal / histamine H2 receptor", "meaning": ["Tiêu hóa / thụ thể histamin H2", "Gastrointestinal / histamine H2 receptor"]}, {"abbr": "US / UK", "full": "United States / United Kingdom", "meaning": ["Hoa Kỳ / Vương quốc Anh", "United States / United Kingdom"]}, {"abbr": "NEXIUM / PROTONIX / ACIPHEX", "full": "Referenced product brands", "meaning": ["Tên biệt dược trong nhãn được dẫn; không xác nhận lưu hành tại Việt Nam", "Referenced brand names; Vietnamese marketing status not confirmed"]}, {"abbr": "INR", "full": "International normalized ratio", "meaning": ["Tỷ số chuẩn hóa quốc tế để theo dõi warfarin", "International normalized ratio for warfarin monitoring"]}, {"abbr": "UM / RM / NM / IM / PM", "full": "Ultrarapid / rapid / normal / intermediate / poor metabolizer", "meaning": ["Các kiểu hình chuyển hóa CYP2C19; không suy từ dân tộc", "CYP2C19 metabolizer phenotypes; do not infer from ethnicity"]}], "refs": [{"id": 1, "text": "DailyMed. Omeprazole delayed-release capsules. Prescribing information [Internet]. [cited 2026 Oct 11].", "url": "https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=557d4c2c-5541-3a51-e063-6394a90ad278"}, {"id": 2, "text": "AstraZeneca. NEXIUM: esomeprazole magnesium delayed-release capsules and oral suspension. Prescribing information [Internet]. DailyMed; [cited 2026 Oct 11].", "url": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f4853677-1622-4037-688b-fdf533a11d96"}, {"id": 3, "text": "Takeda. PREVACID and PREVACID SoluTab: lansoprazole. Prescribing information [Internet]. DailyMed; [cited 2026 Oct 11].", "url": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=71ba78cb-7e46-43eb-9425-fa130f537f84"}, {"id": 4, "text": "Pfizer/Wyeth. PROTONIX: pantoprazole sodium delayed-release tablets and oral suspension. Prescribing information [Internet]. DailyMed; [cited 2026 Oct 11].", "url": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=08098cb2-c048-4640-f387-6beec4a38936"}, {"id": 5, "text": "ACIPHEX: rabeprazole sodium delayed-release tablets. Prescribing information [Internet]. DailyMed; [cited 2026 Oct 11].", "url": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=1eb38279-0237-4967-be7a-c53a826c1138"}, {"id": 6, "text": "Graham DY, Tansel A. Interchangeable use of proton pump inhibitors based on relative potency. Clin Gastroenterol Hepatol. 2018;16(6):800-808.e7.", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6913203/"}, {"id": 7, "text": "Aurobindo Pharma–Milpharm. Pantoprazole 20 mg gastro-resistant tablets. Summary of Product Characteristics [Internet]. emc; [cited 2026 Oct 11].", "url": "https://www.medicines.org.uk/emc/product/7089/smpc"}, {"id": 8, "text": "Quach DT, Mai BH, Tran MK, et al. Vietnam Association of Gastroenterology (VNAGE) consensus on the management of Helicobacter pylori infection. Front Med. 2023;9:1065045. doi:10.3389/fmed.2022.1065045.", "url": "https://www.frontiersin.org/journals/medicine/articles/10.3389/fmed.2022.1065045/full"}, {"id": 9, "text": "Omeprazole 40 mg powder for solution for infusion. Summary of Product Characteristics [Internet]. emc; [cited 2026 Oct 11].", "url": "https://www.medicines.org.uk/emc/product/4402/smpc"}, {"id": 10, "text": "AstraZeneca. NEXIUM I.V.: esomeprazole sodium for injection. Prescribing information [Internet]. DailyMed; [cited 2026 Oct 11].", "url": "https://dailymed.nlm.nih.gov/dailymed/downloadpdffile.cfm?setid=c325bbfc-46f3-471e-7bbc-ed0d6965d13b"}, {"id": 11, "text": "Pfizer/Wyeth. PROTONIX I.V.: pantoprazole sodium for injection. Prescribing information [Internet]. DailyMed; [cited 2026 Oct 11].", "url": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f39b3e7d-39d2-4c8a-9974-4ab885241880"}, {"id": 12, "text": "Laine L, Barkun AN, Saltzman JR, Martel M, Leontiadis GI. ACG clinical guideline: upper gastrointestinal and ulcer bleeding. Am J Gastroenterol. 2021;116(5):899-917. doi:10.14309/ajg.0000000000001245.", "url": "https://pubmed.ncbi.nlm.nih.gov/33929377/"}, {"id": 13, "text": "Choi A, et al. Association between proton pump inhibitor use during early pregnancy and risk of congenital malformations. JAMA Netw Open. 2023;6(1):e2250366.", "url": "https://pubmed.ncbi.nlm.nih.gov/36626173/"}, {"id": 14, "text": "Bhatt DL, Cryer BL, Contant CF, et al. Clopidogrel with or without omeprazole in coronary artery disease. N Engl J Med. 2010;363(20):1909-1917. doi:10.1056/NEJMoa1007964.", "url": "https://pubmed.ncbi.nlm.nih.gov/20925534/"}, {"id": 15, "text": "Katz PO, Dunbar KB, Schnoll-Sussman FH, Greer KB, Yadlapati R, Spechler SJ. ACG clinical guideline: guidelines for the diagnosis and management of gastroesophageal reflux disease. Am J Gastroenterol. 2022;117(1):27-56.", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC8754510/"}, {"id": 16, "text": "Gralnek IM, Dulai GS, Fennerty MB, Spiegel BMR. Esomeprazole versus other proton pump inhibitors in erosive esophagitis: a meta-analysis of randomized clinical trials. Clin Gastroenterol Hepatol. 2006;4(12):1452-1458. doi:10.1016/j.cgh.2006.09.013.", "url": "https://pubmed.ncbi.nlm.nih.gov/17162239/"}, {"id": 17, "text": "Lima JJ, Thomas CD, Barbarino J, et al. Clinical Pharmacogenetics Implementation Consortium (CPIC) guideline for CYP2C19 and proton pump inhibitor dosing. Clin Pharmacol Ther. 2021;109(6):1417-1423. doi:10.1002/cpt.2015.", "url": "https://ascpt.onlinelibrary.wiley.com/doi/10.1002/cpt.2015"}, {"id": 18, "text": "American College of Gastroenterology. ACG guideline on treatment of Helicobacter pylori: new recommendations… will practice change? Evidence-Based GI [Internet]. 2024 Sep [cited 2026 Oct 11].", "url": "https://gi.org/journals-publications/ebgi/schoenfeld_sep2024/"}, {"id": 19, "text": "SCCM/ASHP. Guideline for the prevention of stress-related gastrointestinal bleeding in critically ill adults [Internet]. 2024 [cited 2026 Oct 11].", "url": "https://www.sccm.org/clinical-resources/guidelines/guidelines/sccm-ashp-guideline-prevention-of-ugib"}, {"id": 20, "text": "Targownik LE, Fisher DA, Saini SD. AGA clinical practice update on de-prescribing of proton pump inhibitors: expert review. Gastroenterology. 2022;162(4):1334-1342. doi:10.1053/j.gastro.2021.12.247.", "url": "https://pubmed.ncbi.nlm.nih.gov/35183361/"}, {"id": 21, "text": "Moayyedi P, Eikelboom JW, Bosch J, et al. Safety of proton pump inhibitors based on a large, multi-year, randomized trial of patients receiving rivaroxaban or aspirin. Gastroenterology. 2019;157(3):682-691.e2. doi:10.1053/j.gastro.2019.05.056.", "url": "https://pubmed.ncbi.nlm.nih.gov/31152740/"}], "quiz": [{"q": ["Pantoprazol 40 mg = omeprazol 40 mg trên mọi chỉ định?", "Is pantoprazole 40 mg equivalent to omeprazole 40 mg for every indication?"], "options": [["Không", "No"], ["Có", "Yes"]], "correct": 0, "explain": ["Mg không tương đương giữa PPI; OE phản ánh mô hình ức chế acid, không bảo đảm kết cục lâm sàng.", "Milligrams are not interchangeable; OE describes acid suppression, not guaranteed clinical outcomes."], "refs": [6]}, {"q": ["Đang dùng clopidogrel và có chỉ định PPI: lựa chọn hợp lý?", "Clopidogrel plus a clear PPI indication: reasonable choice?"], "options": [["Omeprazol chỉ cần tách 12 giờ", "Omeprazole separated by 12 h"], ["Bỏ PPI dù nguy cơ xuất huyết cao", "Stop PPI despite high bleeding risk"], ["Pantoprazol, sau đánh giá tương tác", "Pantoprazole after interaction review"]], "correct": 2, "explain": ["Nhãn tránh omeprazol/esomeprazol. Tách giờ không khắc phục đáng tin cậy.", "Labels advise avoiding omeprazole/esomeprazole. Dose separation is not reliable."], "refs": [1, 2, 4]}, {"q": ["Rabeprazol ít phụ thuộc CYP2C19 nghĩa là gì?", "What does less CYP2C19 dependence mean for rabeprazole?"], "options": [["CPIC bắt buộc chỉnh liều theo gen", "CPIC mandates genotype dosing"], ["Vẫn có CYP2C19 tham gia", "CYP2C19 still contributes"], ["Không có tương tác thuốc", "No drug interactions"]], "correct": 1, "explain": ["Có khử không enzym đáng kể nhưng CYP vẫn tham gia; CPIC chưa khuyến cáo chỉnh theo gen cho rabeprazol.", "Substantial nonenzymatic reduction coexists with CYP metabolism; CPIC gives no genotype dosing recommendation."], "refs": [5, 17]}, {"q": ["Esomeprazol IV sau cầm máu nội soi, Child–Pugh C:", "Esomeprazole IV after endoscopic hemostasis, Child–Pugh C:"], "options": [["80 mg/30 phút → 4 mg/giờ trong 71,5 giờ", "80 mg/30 min → 4 mg/h for 71.5 h"], ["Chỉ 20 mg/ngày cho mọi chỉ định", "Only 20 mg/day for all indications"], ["80 mg → 8 mg/giờ không cần chỉnh", "80 mg → 8 mg/h without adjustment"]], "correct": 0, "explain": ["Giới hạn uống cho EE không áp vào phác đồ truyền sau cầm máu. Tổng truyền 72 giờ bao gồm liều đầu.", "Oral EE limits do not apply to post-hemostasis infusion. Total 72 h includes loading."], "refs": [10]}, {"q": ["COGENT có HR tim mạch 0,99, KTC 0,68–1,44:", "COGENT cardiovascular HR 0.99, CI 0.68–1.44:"], "options": [["Chứng minh không có tương tác", "Proves absence of interaction"], ["Chứng minh nguy cơ tăng 44%", "Proves 44% higher risk"], ["Chưa loại trừ tác hại có ý nghĩa", "Clinically meaningful harm not excluded"]], "correct": 2, "explain": ["KTC rộng chứa cả lợi ích và tác hại; không có ý nghĩa thống kê không phải bằng chứng tương đương.", "Wide CI includes benefit and harm; nonsignificance is not equivalence."], "refs": [14]}, {"q": ["PPI ở người lọc máu:", "PPI in a dialysis patient:"], "options": [["Luôn bổ sung liều sau lọc", "Always add a post-dialysis dose"], ["Không giảm liều thường quy chỉ vì CrCl thấp", "No routine reduction solely for low CrCl"], ["Giảm tất cả PPI 50%", "Reduce every PPI by 50%"]], "correct": 1, "explain": ["Thuốc chuyển hóa chủ yếu trước thải trừ; không dùng tỷ lệ chất chuyển hóa trong nước tiểu để suy liều theo thận. Vẫn theo dõi ADR thận.", "Metabolism precedes excretion; urinary metabolites do not imply renal dose reduction. Still monitor renal ADRs."], "refs": [1, 2, 3, 4, 5]}, {"q": ["Ngừng PPI kéo dài khi nào?", "When to stop long-term PPI?"], "options": [["Khi không còn chỉ định, sau đánh giá nguy cơ", "When no longer indicated after risk review"], ["Tất cả bệnh nhân sau 8 tuần", "Every patient after 8 weeks"], ["Chỉ vì đọc thấy liên hệ với sa sút trí tuệ", "Solely because of an observational dementia association"]], "correct": 0, "explain": ["Đánh giá chỉ định và nguy cơ xuất huyết; GERD biến chứng có thể cần duy trì. Cần giải thích tăng tiết acid hồi ứng.", "Review indications and bleeding risk; complicated GERD may need maintenance. Explain rebound acid."], "refs": [20]}, {"q": ["Xét nghiệm xác nhận tiệt trừ H. pylori:", "H. pylori eradication confirmation testing:"], "options": [["Ngay sau viên kháng sinh cuối", "Immediately after the last antibiotic dose"], ["Không cần ngừng PPI", "No need to stop PPI"], ["≥4 tuần sau kháng sinh, ngừng PPI ≥2 tuần", "≥4 weeks after antibiotics, off PPI ≥2 weeks"]], "correct":
