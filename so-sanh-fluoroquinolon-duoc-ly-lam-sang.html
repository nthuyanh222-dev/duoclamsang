<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>So sánh Ciprofloxacin – Levofloxacin – Moxifloxacin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js" defer></script>
<style>
:root{--bg:#c4ccda;--bg2:#b8c2d3;--card:#eef1f6;--card2:#dfe5ee;--line:#aab6c9;--tx:#0a1020;--mut:#2f3d54;--dim:#4a5a73;
--cip:#db2777;--lev:#0284c7;--mox:#0d9488;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx);background:linear-gradient(180deg,#a9b5c9,#c4ccda);min-height:100vh;line-height:1.5}
[x-cloak]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(10,16,32,.12)}
.hero h1{margin:0;font-size:1.35rem;font-weight:800}
.hero p{margin:4px 0 0;color:var(--mut);font-size:.85rem}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:10px;padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer;font-family:inherit}
.btn:hover{background:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:6px 14px 6px 8px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--mut);font-family:inherit}
.tab.on{background:#fff;color:var(--tx);border-color:#6b7a94;box-shadow:0 3px 10px rgba(10,16,32,.15)}
.ico{width:34px;height:34px;display:inline-block}
.ico svg{width:100%;height:100%}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(10,16,32,.1)}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.dbtn{border:2px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:5px 14px;font-weight:800;font-size:.82rem;cursor:pointer;opacity:.6;font-family:inherit}
.dbtn.on{background:var(--c);color:#fff;opacity:1}
.cnt{font-size:.8rem;color:var(--mut);font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--mut);font-family:inherit}
.chip.on{background:#0a1020;color:#fff;border-color:#0a1020}
table.cmp{width:100%;table-layout:fixed;border-collapse:collapse;font-size:.78rem}
.cmp th,.cmp td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;overflow-wrap:anywhere;text-align:left}
.cmp thead th{color:#fff;font-size:.9rem;position:sticky;top:0}
.cmp th.lab{width:15%;background:var(--card2);position:sticky;left:0;font-weight:700}
.cmp tr.band td{background:#0a1020;color:#fff;font-weight:800;font-size:.76rem;letter-spacing:.03em;text-transform:uppercase}
.cmp tr.z td,.cmp tr.z th.lab{background:#e4e9f1}
.cmp td ul{margin:0;padding-left:14px}
.cmp td li{margin:1px 0}
.rf{color:var(--info);font-weight:700;font-size:.7rem;white-space:nowrap}
.uf{color:var(--warn);font-weight:800}
.qg{background:#c7e8d1!important}.qw{background:#f6dfa8!important}.qb{background:#f2bcbc!important}.qn{background:#d6deea!important}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;margin:8px 0;align-items:center}
.legend span.k{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;margin-right:4px}
.scroll{overflow-x:auto}
@media(max-width:860px){table.cmp{min-width:780px}}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
label.f{display:block;font-size:.76rem;font-weight:700;color:var(--mut);margin-bottom:2px}
input,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:.85rem;background:#fff;color:var(--tx)}
.chk{display:flex;gap:6px;align-items:flex-start;font-size:.8rem;margin:3px 0}
.chk input{width:auto;margin-top:3px}
.res{border-radius:14px;border:2px solid var(--c);background:#fff;padding:12px}
.res h3{margin:0 0 6px;color:var(--c);font-size:1rem}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:800;color:#fff;margin-bottom:6px}
.st.ok{background:var(--ok)}.st.warn{background:var(--warn)}.st.avoid{background:var(--bad)}.st.contra{background:#450a0a}
.dose{font-weight:800;font-size:.95rem;margin:4px 0}
.res ul{margin:6px 0 0;padding-left:16px;font-size:.78rem}
.case{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.case h3{margin:0 0 6px;font-size:.95rem}
.case .row{font-size:.8rem;margin:3px 0}
.tag{font-weight:800;padding:1px 8px;border-radius:6px;font-size:.7rem;color:#fff;margin-right:4px}
.tg{background:var(--ok)}.tw{background:var(--warn)}.tr{background:var(--bad)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;margin:5px 0;font-family:inherit;font-size:.84rem;cursor:pointer}
.opt.right{background:#c7e8d1;border-color:var(--ok)}.opt.wrong{background:#f2bcbc;border-color:var(--bad)}
.note{font-size:.8rem;margin:6px 0}
.sec{margin-top:18px}
.sec h2{font-size:1.05rem;margin:0 0 8px}
table.gl{width:100%;border-collapse:collapse;font-size:.76rem;table-layout:fixed}
.gl th,.gl td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.gl th{background:var(--card2)}
.gl td:first-child{width:14%;font-weight:800}
.refs ol{padding-left:20px;font-size:.76rem;margin:0}
.refs li{margin:3px 0;overflow-wrap:anywhere}
.disc{font-size:.76rem;color:var(--mut);margin-top:10px}
a{color:var(--info)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#be185d"/></linearGradient>
<linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
<linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<linearGradient id="g-ind" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#3730a3"/></linearGradient>
<linearGradient id="g-amb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#b45309"/></linearGradient>
<radialGradient id="g-ped" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d2e0"/></radialGradient>
</defs></svg>

<div class="wrap" x-data="app()" x-cloak>
  <div class="hero">
    <span class="ico" style="width:56px;height:56px" x-html="ic('capsule')"></span>
    <div>
      <h1 x-text="UI('title')"></h1>
      <p x-text="UI('sub')"></p>
    </div>
    <div class="spacer"></div>
    <button class="btn" @click="lang = (lang==='vi'?'en':'vi')" x-text="lang==='vi'?'English':'Tiếng Việt'"></button>
  </div>

  <div class="tabs">
    <template x-for="t in tabs" :key="t.k">
      <button class="tab" :class="{on:view===t.k}" @click="view=t.k">
        <span class="ico" x-html="ic(t.ic)"></span><span x-text="UI(t.k)"></span>
      </button>
    </template>
  </div>

  <!-- picker for view 1-2 -->
  <div class="panel" x-show="view==='table'||view==='matrix'">
    <div class="picker">
      <template x-for="d in drugs" :key="d.k">
        <button class="dbtn" :style="'--c:'+d.c" :class="{on:sel.includes(d.k)}" @click="toggle(d.k)" x-text="(sel.includes(d.k)?'✓ ':'')+d.n[0]"></button>
      </template>
      <span class="cnt" x-text="UI('comparing')+' '+sel.length+'/3 · '+selNames()"></span>
    </div>

    <!-- VIEW 1 -->
    <div x-show="view==='table'">
      <div class="filters">
        <button class="chip" :class="{on:grp==='all'}" @click="grp='all'" x-text="UI('all')"></button>
        <template x-for="g in groups" :key="g.k">
          <button class="chip" :class="{on:grp===g.k}" @click="grp=g.k" x-text="T(g.n)"></button>
        </template>
      </div>
      <div class="scroll">
      <table class="cmp">
        <thead><tr><th class="lab" style="background:#0a1020;color:#fff" x-text="UI('crit')"></th>
          <template x-for="d in selDrugs()" :key="d.k"><th :style="'background:'+d.c" x-text="d.n[0]"></th></template></tr></thead>
        <tbody>
          <template x-for="(r,i) in visibleRows()" :key="r.k">
            <template x-if="true">
              <tr :class="r.band?'band':(i%2?'z':'')">
                <template x-if="r.band"><td :colspan="1+sel.length" x-text="T(r.n)"></td></template>
                <template x-if="!r.band">
                  <th class="lab" x-text="T(r.n)"></th>
                </template>
                <template x-if="!r.band">
                  <template x-for="d in selDrugs()" :key="d.k">
                    <td>
                      <ul><template x-for="p in parts(cell(r,d.k))"><li x-text="p"></li></template></ul>
                      <span class="rf" x-text="refTxt(r,d.k)"></span>
                    </td>
                  </template>
                </template>
              </tr>
            </template>
          </template>
        </tbody>
      </table>
      </div>
      <p class="note"><span class="uf">‡</span> <span x-text="UI('uflag')"></span></p>
    </div>

    <!-- VIEW 2 -->
    <div x-show="view==='matrix'">
      <div class="legend">
        <span><span class="k qg"></span><span x-text="UI('lg')"></span></span>
        <span><span class="k qw"></span><span x-text="UI('lw')"></span></span>
        <span><span class="k qb"></span><span x-text="UI('lb')"></span></span>
        <span><span class="k qn"></span><span x-text="UI('ln')"></span></span>
        <a href="#gloss" x-text="UI('gotoGloss')"></a>
      </div>
      <div class="scroll">
      <table class="cmp">
        <thead><tr><th class="lab" style="background:#0a1020;color:#fff" x-text="UI('crit')"></th>
          <template x-for="d in selDrugs()" :key="d.k"><th :style="'background:'+d.c" x-text="d.n[0]"></th></template></tr></thead>
        <tbody>
          <template x-for="q in quick" :key="q.k">
            <tr>
              <th class="lab" x-text="T(q.n)"></th>
              <template x-for="d in selDrugs()" :key="d.k">
                <td :class="q.v[d.k][0]"><span x-text="T([q.v[d.k][1],q.v[d.k][2]])"></span> <span class="rf" x-text="q.v[d.k][3]?'['+q.v[d.k][3]+']':''"></span></td>
              </template>
            </tr>
          </template>
        </tbody>
      </table>
      </div>
      <p class="note" x-text="UI('qnote')"></p>
    </div>
  </div>

  <!-- VIEW 3 dose tool -->
  <div class="panel" x-show="view==='dose'">
    <div class="grid g2">
      <div><label class="f" x-text="UI('age')"></label><input type="number" min="0" max="120" x-model.number="p.age"></div>
      <div><label class="f" x-text="UI('wt')"></label><input type="number" min="1" max="300" x-model.number="p.wt"></div>
      <div><label class="f" x-text="UI('sex')"></label>
        <select x-model="p.sex"><option value="m" x-text="UI('male')"></option><option value="f" x-text="UI('female')"></option></select></div>
      <div><label class="f" x-text="UI('scr')"></label><input type="number" step="0.01" min="0.1" x-model.number="p.scr"></div>
      <div><label class="f" x-text="UI('unit')"></label>
        <select x-model="p.unit"><option value="mg">mg/dL</option><option value="umol">µmol/L</option></select></div>
      <div><label class="f" x-text="UI('ind')"></label>
        <select x-model="p.ind"><template x-for="i in inds" :key="i.k"><option :value="i.k" x-text="T(i.n)"></option></template></select></div>
      <div><label class="f" x-text="UI('child')"></label>
        <select x-model="p.child"><option value="none" x-text="UI('noLiver')"></option><option value="A">Child-Pugh A</option><option value="B">Child-Pugh B</option><option value="C">Child-Pugh C</option></select></div>
    </div>
    <div class="grid g2" style="margin-top:10px">
      <div>
        <label class="chk"><input type="checkbox" x-model="p.hd"><span x-text="UI('hd')"></span></label>
        <label class="chk"><input type="checkbox" x-model="p.round"><span x-text="UI('round')"></span></label>
        <label class="chk"><input type="checkbox" x-model="p.mg"><span x-text="UI('mg')"></span></label>
        <label class="chk"><input type="checkbox" x-model="p.preg"><span x-text="UI('preg')"></span></label>
        <label class="chk"><input type="checkbox" x-model="p.tendon"><span x-text="UI('tendon')"></span></label>
      </div>
      <div>
        <label class="chk"><input type="checkbox" x-model="p.cation"><span x-text="UI('cation')"></span></label>
        <label class="chk"><input type="checkbox" x-model="p.qt"><span x-text="UI('qt')"></span></label>
        <label class="chk"><input type="checkbox" x-model="p.cyp"><span x-text="UI('cyp')"></span></label>
        <label class="chk"><input type="checkbox" x-model="p.tiz"><span x-text="UI('tiz')"></span></label>
        <label class="chk"><input type="checkbox" x-model="p.dm"><span x-text="UI('dm')"></span></label>
      </div>
    </div>
    <p class="note"><b>CrCl (Cockcroft–Gault, <span x-text="UI('actualWt')"></span>): </b><span x-text="crclTxt()"></span></p>
    <div class="grid g3">
      <template x-for="d in drugs" :key="d.k">
        <div class="res" :style="'--c:'+d.c" x-data="{r:evalDose(d.k,p)}" x-effect="r=evalDose(d.k,p)">
          <h3 x-text="d.n[0]"></h3>
          <span class="st" :class="r.status" x-text="UI('st_'+r.status)"></span>
          <div class="dose" x-text="T(r.dose)"></div>
          <ul><template x-for="n in r.notes"><li x-text="T(n)"></li></template></ul>
        </div>
      </template>
    </div>
    <p class="note" x-text="UI('doseDisc')"></p>
  </div>

  <!-- VIEW 4 cases -->
  <div class="panel" x-show="view==='cases'">
    <div class="grid g3">
      <template x-for="c in cases" :key="c.k">
        <div class="case">
          <h3 x-text="T(c.n)"></h3>
          <div class="row"><span class="tag tg" x-text="UI('prefer')"></span><span x-text="T(c.pref)"></span></div>
          <div class="row"><span class="tag tw" x-text="UI('alt')"></span><span x-text="T(c.alt)"></span></div>
          <div class="row"><span class="tag tr" x-text="UI('avoid')"></span><span x-text="T(c.avoid)"></span></div>
          <div class="row"><b x-text="UI('why')"></b> <span x-text="T(c.why)"></span> <span class="rf" x-text="'['+c.ref+']'"></span></div>
        </div>
      </template>
    </div>
    <p class="note" x-text="UI('caseNote')"></p>
  </div>

  <!-- VIEW 5 quiz -->
  <div class="panel" x-show="view==='quiz'">
    <template x-for="(q,qi) in quiz" :key="qi">
      <div style="margin-bottom:14px">
        <div style="font-weight:800;font-size:.9rem" x-text="(qi+1)+'. '+T(q.q)"></div>
        <template x-for="(o,oi) in q.o" :key="oi">
          <button class="opt" :class="optClass(qi,oi)" @click="answer(qi,oi)" x-text="T(o)"></button>
        </template>
        <div class="note" x-show="ans[qi]!==undefined"><b x-text="UI('expl')"></b> <span x-text="T(q.e)"></span></div>
      </div>
    </template>
    <div style="font-weight:800" x-text="UI('score')+': '+score()+'/'+quiz.length"></div>
    <button class="btn" style="margin-top:6px" @click="ans={}" x-text="UI('reset')"></button>
  </div>

  <!-- NOTES -->
  <div class="sec panel">
    <h2 x-text="UI('notes')"></h2>
    <template x-for="(n,i) in notes" :key="i"><p class="note" x-text="(i+1)+'. '+T(n)"></p></template>
  </div>

  <!-- GLOSS -->
  <div class="sec panel" id="gloss">
    <h2 x-text="UI('gloss')"></h2>
    <template x-for="g in gloss" :key="g.k">
      <div style="margin-bottom:10px">
        <div style="font-weight:800;font-size:.82rem;margin:4px 0" x-text="T(g.n)"></div>
        <table class="gl"><thead><tr><th x-text="UI('abbr')"></th><th x-text="UI('full')"></th><th x-text="UI('mean')"></th></tr></thead>
        <tbody><template x-for="r in g.r" :key="r[0]"><tr><td x-text="r[0]"></td><td x-text="T([r[1],r[2]])"></td><td x-text="T([r[3],r[4]])"></td></tr></template></tbody></table>
      </div>
    </template>
  </div>

  <!-- REFS -->
  <div class="sec panel refs">
    <h2 x-text="UI('refs')"></h2>
    <ol><template x-for="r in refs"><li x-text="r"></li></template></ol>
    <p class="disc" x-text="UI('disc')"></p>
  </div>
</div>

<script>
/* ===== 3D icon helpers ===== */
function wrapSvg(inner){return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><ellipse cx="32" cy="55" rx="22" ry="6" fill="url(#g-ped)" stroke="#aab6c9" stroke-width=".8"/><ellipse cx="32" cy="53" rx="14" ry="3" fill="rgba(10,16,32,.12)"/>'+inner+'</svg>';}
function tablet(g){return '<ellipse cx="32" cy="38" rx="18" ry="9" fill="url(#'+g+')" opacity=".55"/><ellipse cx="32" cy="32" rx="18" ry="9" fill="url(#'+g+')"/><ellipse cx="29" cy="29" rx="9" ry="3" fill="#fff" opacity=".35"/><line x1="16" y1="32" x2="48" y2="32" stroke="#fff" stroke-opacity=".5"/>';}
function capsule(){return '<g transform="rotate(-30 32 34)"><rect x="12" y="24" width="40" height="18" rx="9" fill="url(#g-pink)"/><path d="M32 24h11a9 9 0 0 1 0 18H32z" fill="url(#g-blue)"/><rect x="16" y="27" width="28" height="4" rx="2" fill="#fff" opacity=".35"/></g>';}
function sphere(g){return '<circle cx="32" cy="34" r="16" fill="url(#'+g+')"/><ellipse cx="26" cy="27" rx="6" ry="4" fill="#fff" opacity=".4"/>';}
function tile(g){return '<rect x="14" y="18" width="36" height="28" rx="6" fill="url(#'+g+')"/><rect x="18" y="22" width="28" height="5" rx="2" fill="#fff" opacity=".4"/><rect x="18" y="31" width="20" height="3" rx="1.5" fill="#fff" opacity=".35"/><rect x="18" y="37" width="24" height="3" rx="1.5" fill="#fff" opacity=".35"/>';}
var ICONS={
 capsule:function(){return wrapSvg(capsule());},
 table:function(){return wrapSvg(tile('g-ind'));},
 matrix:function(){return wrapSvg('<rect x="14" y="18" width="16" height="12" rx="3" fill="url(#g-teal)"/><rect x="34" y="18" width="16" height="12" rx="3" fill="url(#g-amb)"/><rect x="14" y="34" width="16" height="12" rx="3" fill="url(#g-pink)"/><rect x="34" y="34" width="16" height="12" rx="3" fill="url(#g-blue)"/>');},
 dose:function(){return wrapSvg(tablet('g-blue')+'<circle cx="46" cy="24" r="7" fill="url(#g-amb)"/>');},
 cases:function(){return wrapSvg(sphere('g-teal')+'<rect x="29" y="26" width="6" height="18" rx="2" fill="#fff"/><rect x="23" y="32" width="18" height="6" rx="2" fill="#fff"/>');},
 quiz:function(){return wrapSvg(sphere('g-ind')+'<text x="32" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" font-family="Arial">?</text>');}
};

/* ===== Data ===== */
var DRUGS=[
 {k:'cip',n:['Ciprofloxacin','Ciprofloxacin'],c:'#db2777'},
 {k:'lev',n:['Levofloxacin','Levofloxacin'],c:'#0284c7'},
 {k:'mox',n:['Moxifloxacin','Moxifloxacin'],c:'#0d9488'}
];
var GROUPS=[
 {k:'g1',n:['Dược lý & phổ kháng khuẩn','Pharmacology & spectrum']},
 {k:'g2',n:['Dược động học','Pharmacokinetics']},
 {k:'g3',n:['Chỉ định & liều theo nhãn','Labeled indications & dosing']},
 {k:'g4',n:['Hiệu chỉnh thận & gan','Renal & hepatic adjustment']},
 {k:'g5',n:['An toàn','Safety']},
 {k:'g6',n:['Tương tác thuốc','Drug interactions']},
 {k:'g7',n:['Dân số đặc biệt','Special populations']}
];

/* ===== Dose logic ===== */
var RANK={ok:0,warn:1,avoid:2,contra:3};
function crclOf(p){
  if(!p.age||!p.wt||!p.scr||p.scr<=0) return null;
  var s=p.scr; if(p.unit==='umol') s=s/88.4;
  if(p.round && s<0.8) s=0.8;
  var v=((140-p.age)*p.wt)/(72*s);
  if(p.sex==='f') v*=0.85;
  return v;
}
function evalDose(k,p){
  var b=BASE[k][p.ind]; var st=b[0]; var dose=[b[1],b[2]]; var notes=[];
  function up(s){ if(RANK[s]>RANK[st]) st=s; }
  function add(vi,en){ notes.push([vi,en]); }
  if(b[3]) add(b[3],b[4]);
  var cl=crclOf(p);
  if(st!=='avoid'){
    if(k==='cip'){
      if(p.hd){ dose=['250–500 mg mỗi 24 giờ, dùng sau lọc máu','250–500 mg q24h, given after dialysis']; }
      else if(cl!==null && cl>=30 && cl<=50){ dose=['250–500 mg uống mỗi 12 giờ (CrCl 30–50)','250–500 mg PO q12h (CrCl 30–50)']; add('Chỉnh liều theo CrCl 30–50 mL/phút.','Adjusted for CrCl 30–50 mL/min.'); }
      else if(cl!==null && cl>=5 && cl<30){ dose=['250–500 mg uống mỗi 18 giờ (nhãn FDA) hoặc mỗi 24 giờ (một số SmPC)','250–500 mg PO q18h (FDA label) or q24h (some SmPCs)']; add('CrCl 5–29 mL/phút: kiểm tra khoảng cách liều theo nhãn lưu hành tại cơ sở.','CrCl 5–29 mL/min: verify the dosing interval against the locally marketed label.'); }
      else if(cl!==null && cl<5){ dose=['CrCl <5 mL/phút: nhãn không nêu rõ ngoài lọc máu; cần hội chẩn','CrCl <5 mL/min: label silent outside dialysis; seek specialist input']; up('warn'); }
    }
    if(k==='lev'){
      var reg=b[5];
      var dlv=null;
      if(p.hd || (cl!==null && cl>=10 && cl<20)){
        if(reg===750) dlv=['750 mg liều đầu, sau đó 500 mg mỗi 48 giờ','750 mg initial, then 500 mg q48h'];
        else if(reg===250) dlv=['250 mg mỗi 48 giờ (lọc máu: nhãn không có thông tin)','250 mg q48h (dialysis: no label information)'];
      } else if(cl!==null && cl>=20 && cl<50){
        if(reg===750) dlv=['750 mg mỗi 48 giờ','750 mg q48h'];
        else if(reg===250) dlv=['250 mg mỗi 24 giờ (không cần chỉnh liều; viêm bàng quang không biến chứng)','250 mg q24h (no adjustment; uncomplicated cystitis)'];
      } else if(cl!==null && cl<10 && !p.hd){
        dlv=['CrCl <10 mL/phút (không lọc máu): nhãn không nêu rõ; cần hội chẩn','CrCl <10 mL/min (no dialysis): label silent; seek specialist input']; up('warn');
      }
      if(dlv){ dose=dlv; add('Đã chỉnh liều theo bảng thận của nhãn (CrCl <50 mL/phút).','Adjusted per label renal table (CrCl <50 mL/min).'); }
      if(p.ind==='cap' && cl!==null && cl<50 && cl>=20 && !p.hd){ add('Nếu dùng phác đồ 500 mg: 500 mg liều đầu rồi 250 mg mỗi 24 giờ.','If using the 500 mg regimen: 500 mg then 250 mg q24h.'); }
    }
    if(k==='mox'){
      if(cl!==null && cl<30) add('Không cần chỉnh liều thận, kể cả lọc máu.','No renal adjustment needed, including dialysis.');
    }
  }
  if(p.child==='C' && k==='mox'){ up('warn'); add('Child-Pugh C: nhãn FDA không chỉnh liều nhưng SmPC không khuyến cáo; cân nhắc thuốc khác.','Child-Pugh C: FDA no adjustment but SmPC advises against; consider another agent.'); }
  if(p.child==='B' || p.child==='C'){ if(k!=='mox') add('Suy gan: nhãn không nêu chỉnh liều; theo dõi chặt.','Hepatic impairment: no adjustment in label; monitor closely.'); }
  if(p.mg){ up('avoid'); add('Tiền sử nhược cơ: tránh fluoroquinolon (có thể nặng thêm yếu cơ).','Myasthenia gravis history: avoid fluoroquinolones (may worsen weakness).'); }
  if(k==='cip' && p.tiz){ up('contra'); add('Chống chỉ định phối hợp ciprofloxacin với tizanidin.','Ciprofloxacin with tizanidine is contraindicated.'); }
  if(k==='cip' && p.cyp){ up('warn'); add('Ciprofloxacin ức chế CYP1A2: theo dõi nồng độ/độc tính của thuốc nền CYP1A2.','Ciprofloxacin inhibits CYP1A2: monitor levels/toxicity of CYP1A2 substrates.'); }
  if((k==='lev'||k==='mox') && p.tiz){ add('Tizanidin: không có tương tác CYP1A2 đáng kể với thuốc này theo nhãn (cần đối chiếu thêm).','Tizanidine: no significant CYP1A2 interaction per label for this drug (verify further).'); }
  if(p.qt){ if(k==='mox'){ up('avoid'); add('Tránh khi QT kéo dài, hạ kali/magie hoặc thuốc kéo dài QT (nhãn).','Avoid with prolonged QT, hypoK/hypoMg or QT-prolonging drugs (label).'); } else { up('warn'); add('Có nguy cơ kéo dài QT dạng nhóm; theo dõi điện tâm đồ và điện giải.','Class QT risk; monitor ECG and electrolytes.'); } }
  if(p.cation){ if(k==='cip') add('Uống cách cation: thuốc trước 2 giờ hoặc sau 6 giờ.','Separate from cations: 2 h before or 6 h after.'); if(k==='lev') add('Uống cách cation ít nhất 2 giờ.','Separate from cations by at least 2 h.'); if(k==='mox') add('Uống trước 4 giờ hoặc sau 8 giờ so với cation.','Take 4 h before or 8 h after cations.'); }
  if(p.tendon){ up('warn'); add('Nguy cơ viêm/đứt gân tăng (corticosteroid, ghép tạng, tiền sử): cân nhắc thuốc khác.','Increased tendinitis/rupture risk (corticosteroid, transplant, history): consider another class.'); }
  if(p.dm){ up('warn'); add('Theo dõi đường huyết chặt (nguy cơ hạ đường huyết).','Monitor glucose closely (hypoglycemia risk).'); }
  if(p.preg){ up(k==='mox'?'avoid':'warn'); add('Thai kỳ/cho con bú: tránh nếu có lựa chọn khác.','Pregnancy/lactation: avoid if alternatives exist.'); }
  if(p.age!==null && p.age!==undefined && p.age!=='' && p.age<18){ up(k==='mox'?'avoid':'warn'); add('Dưới 18 tuổi: chỉ dùng cho chỉ định nhãn dành cho trẻ em; liều theo cân nặng, cần dược sĩ/chuyên khoa xác nhận.','Under 18: only for pediatric-labeled indications; weight-based dosing needs specialist confirmation.'); }
  if(p.age>=65) add('Người cao tuổi: tăng nguy cơ gân và (với moxifloxacin) QT.','Elderly: higher tendon risk and (moxifloxacin) QT risk.');
  if((st==='avoid'||st==='contra') && dose[0]!=='Không khuyến cáo'){ dose=st==='contra'?['Không dùng phối hợp','Do not co-administer']:['Tránh trong tình huống này (xem lưu ý)','Avoid in this situation (see notes)']; }
  return {status:st,dose:dose,notes:notes};
}

function app(){
  return {
    lang:'vi',view:'table',sel:['cip','lev','mox'],grp:'all',ans:{},
    tabs:[{k:'table',ic:'table'},{k:'matrix',ic:'matrix'},{k:'dose',ic:'dose'},{k:'cases',ic:'cases'},{k:'quiz',ic:'quiz'}],
    drugs:DRUGS,groups:GROUPS,quick:QUICK,inds:INDS,cases:CASES,quiz:QUIZ,notes:NOTES,gloss:GLOSS,
    refs:REFS,
    p:{age:60,wt:60,sex:'f',scr:1.0,unit:'mg',ind:'cap',child:'none',hd:false,round:false,mg:false,preg:false,tendon:false,cation:false,qt:false,cyp:false,tiz:false,dm:false},
    evalDose:evalDose,
    T:function(a){return this.lang==='vi'?a[0]:a[1];},
    UI:function(k){var d=this.lang==='vi'?UI_VI:UI_EN;return d[k]!==undefined?d[k]:k;},
    ic:function(n){return ICONS[n]();},
    toggle:function(k){var i=this.sel.indexOf(k);if(i>=0){if(this.sel.length>2)this.sel.splice(i,1);}else this.sel.push(k);this.sel=DRUGS.map(function(d){return d.k;}).filter(function(x){return this.sel.indexOf(x)>=0;},this);},
    selDrugs:function(){var s=this.sel;return DRUGS.filter(function(d){return s.indexOf(d.k)>=0;});},
    selNames:function(){return this.selDrugs().map(function(d){return d.n[0];}).join(', ');},
    visibleRows:function(){var g=this.grp;return ROWS.filter(function(r){return g==='all'||r.g===g;});},
    cell:function(r,dk){var c=r[dk];return this.lang==='vi'?c[0]:c[1];},
    refTxt:function(r,dk){var c=r[dk];return '['+c[2]+']'+(c[3]==='u'?' ‡':'');},
    parts:function(s){if(s.length<=95)return [s];return s.split(/[.;]\s+/).map(function(x){return x.replace(/\.$/,'');}).filter(function(x){return x.length>0;});},
    crclTxt:function(){var v=crclOf(this.p);return v===null?'—':(Math.round(v*10)/10).toString().replace('.',',')+' mL/'+(this.lang==='vi'?'phút':'min');},
    answer:function(qi,oi){if(this.ans[qi]===undefined){this.ans=Object.assign({},this.ans,(function(){var o={};o[qi]=oi;return o;})());}},
    optClass:function(qi,oi){var a=this.ans[qi];if(a===undefined)return '';var c=QUIZ[qi].c;if(oi===c)return 'right';if(oi===a)return 'wrong';return '';},
    score:function(){var s=0;for(var i=0;i<QUIZ.length;i++){if(this.ans[i]===QUIZ[i].c)s++;}return s;}
  };
}
