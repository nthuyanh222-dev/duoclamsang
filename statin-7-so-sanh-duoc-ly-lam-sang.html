<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dược lý lâm sàng so sánh 7 statin: tra cứu, quy đổi liều và lựa chọn theo tình huống</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b1120; color: #f8fafc; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #030712 100%); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,.4), 0 8px 10px -6px rgba(0,0,0,.3); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="antialiased min-h-screen" x-data="statinApp()">

<header class="header-bg border-b border-slate-800 text-white pt-8 pb-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-6 border-b border-slate-800/80 pb-6">
            <div>
                <div class="flex items-center gap-2 mb-2 flex-wrap">
                    <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-rose-500/20 text-rose-300 border border-rose-500/30">
                        <i class="fa-solid fa-heart-pulse mr-1"></i> <span x-text="u('badge1')"></span>
                    </span>
                    <span class="px-3 py-1 rounded-full text-xs font-bold bg-sky-500/20 text-sky-300 border border-sky-500/30" x-text="u('badge2')"></span>
                    <span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">ACC/AHA 2018 · ESC/EAS 2019 · KDIGO 2013</span>
                </div>
                <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white" x-text="u('title')"></h1>
                <p class="text-slate-300 text-sm sm:text-base mt-2 max-w-3xl" x-text="u('subtitle')"></p>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <button @click="toggleLang()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-3.5 py-2 rounded-xl border border-slate-600 text-xs font-semibold transition card-shadow">
                    <i class="fa-solid fa-language text-amber-400 text-base"></i>
                    <span x-text="lang === 'vi' ? 'English' : 'Tiếng Việt'"></span>
                </button>
                <template x-for="v in views" :key="v.id">
                    <button @click="activeView = v.id"
                            :class="activeView === v.id ? 'bg-rose-600 text-white font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
                            class="px-3.5 py-2 rounded-xl text-xs font-medium border border-slate-700 transition">
                        <i :class="v.icon + ' mr-1'"></i> <span x-text="u(v.label)"></span>
                    </button>
                </template>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <template x-for="c in summaryCards" :key="c.key">
                <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex items-center gap-3">
                    <div :class="c.iconBg" class="w-11 h-11 rounded-xl flex items-center justify-center text-xl shrink-0"><i :class="c.icon"></i></div>
                    <div>
                        <h4 class="font-bold text-[11px] uppercase tracking-wider text-slate-400" x-text="c.title[lang]"></h4>
                        <p class="text-xs font-semibold text-slate-200 mt-0.5 leading-relaxed" x-html="c.body[lang]"></p>
                    </div>
                </div>
            </template>
        </div>

        <p class="mt-4 text-[11px] text-slate-400 leading-relaxed">
            <i class="fa-solid fa-triangle-exclamation text-amber-400 mr-1"></i><span x-text="u('disclaimer')"></span>
        </p>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- ============ SO SÁNH ĐỐI ĐẦU ============ -->
    <section x-show="activeView === 'headToHead'" class="space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 card-shadow">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-800">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-code-compare text-rose-400"></i><span x-text="u('h2hTitle')"></span>
                    </h2>
                    <p class="text-xs text-slate-400 mt-1" x-text="u('h2hSub')"></p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold text-rose-400 uppercase" x-text="u('statin') + ' 1:'"></label>
                        <select x-model="selectedStatin1" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2">
                            <template x-for="s in statins" :key="s.id"><option :value="s.id" x-text="s.name"></option></template>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold text-sky-400 uppercase" x-text="u('statin') + ' 2:'"></label>
                        <select x-model="selectedStatin2" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2">
                            <template x-for="s in statins" :key="s.id"><option :value="s.id" x-text="s.name"></option></template>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold text-amber-400 uppercase" x-text="u('statin') + ' 3 (' + u('optional') + '):'"></label>
                        <select x-model="selectedStatin3" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2">
                            <option value="none" x-text="u('none')"></option>
                            <template x-for="s in statins" :key="s.id"><option :value="s.id" x-text="s.name"></option></template>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <template x-for="slot in h2hSlots" :key="slot.n">
                    <div x-show="slot.id !== 'none'" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden card-shadow">
                        <div :class="getStatin(slot.id).badgeBg" class="p-5 text-white flex items-center justify-between">
                            <div>
                                <span class="text-[10px] font-extrabold uppercase tracking-widest opacity-80" x-text="getStatin(slot.id).brand"></span>
                                <h3 class="text-2xl font-black" x-text="getStatin(slot.id).name"></h3>
                                <p class="text-xs opacity-90" x-text="getStatin(slot.id).type[lang]"></p>
                            </div>
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl"><i class="fa-solid fa-pills"></i></div>
                        </div>
                        <div class="p-4 space-y-3.5">
                            <template x-for="p in paramKeys" :key="p.key">
                                <div class="p-3.5 rounded-xl bg-slate-800/60 border border-slate-700/80">
                                    <div :class="slot.color" class="text-[11px] font-bold uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                        <i :class="p.icon"></i><span x-text="p.title[lang]"></span>
                                    </div>
                                    <div class="text-xs font-semibold text-slate-100 leading-relaxed" x-html="getStatin(slot.id)[p.key][lang]"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- ============ MA TRẬN ============ -->
    <section x-show="activeView === 'matrix'" class="space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 card-shadow overflow-hidden">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-table-cells text-sky-400"></i><span x-text="u('matrixTitle')"></span>
                    </h2>
                    <p class="text-xs text-slate-400 mt-1" x-text="u('matrixSub')"></p>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400 uppercase font-bold" x-text="u('filter')"></span>
                    <select x-model="matrixFilter" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2">
                        <template x-for="f in matrixFilters" :key="f.id"><option :value="f.id" x-text="f.label[lang]"></option></template>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[1100px]">
                    <thead>
                        <tr class="bg-slate-800/90 text-slate-200 border-b border-slate-700 text-xs uppercase tracking-wider">
                            <th class="p-3 font-extrabold w-48 sticky left-0 bg-slate-800 z-10" x-text="u('parameter')"></th>
                            <template x-for="s in statins" :key="s.id">
                                <th class="p-3 font-black text-center border-l border-slate-700/60 min-w-[140px]" :class="s.textHeaderColor">
                                    <div class="text-sm" x-text="s.name"></div>
                                    <div class="text-[10px] text-slate-400 font-medium" x-text="s.brand"></div>
                                </th>
                            </template>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800 text-xs">
                        <template x-for="p in paramKeys" :key="p.key">
                            <tr x-show="matrixFilter === 'all' || matrixFilter === p.group" class="hover:bg-slate-800/40 transition">
                                <td class="p-3 font-bold text-slate-200 sticky left-0 bg-slate-900 border-r border-slate-800">
                                    <i :class="p.icon + ' mr-1 text-rose-400'"></i><span x-text="p.title[lang]"></span>
                                </td>
                                <template x-for="s in statins" :key="s.id">
                                    <td class="p-3 text-center border-l border-slate-800/60 align-top" x-html="s[p.key][lang]"></td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- ============ QUY ĐỔI LIỀU ============ -->
    <section x-show="activeView === 'calculator'" class="space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 card-shadow">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-2xl"><i class="fa-solid fa-calculator"></i></div>
                <div>
                    <h2 class="text-xl font-bold text-white" x-text="u('calcTitle')"></h2>
                    <p class="text-xs text-slate-400" x-text="u('calcSub')"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 bg-slate-800/80 p-6 rounded-2xl border border-slate-700">
                <!-- Nhập liệu -->
                <div class="lg:col-span-5 space-y-5">
                    <div>
                        <h3 class="text-xs font-bold text-rose-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-pills mr-1"></i><span x-text="u('calcStep1')"></span></h3>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5" x-text="u('statinLabel')"></label>
                        <select x-model="calcDrug" @change="onDrugChange()" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl p-3">
                            <template x-for="s in statins" :key="s.id"><option :value="s.id" :selected="s.id === calcDrug" x-text="s.name + ' (' + s.brand + ')'"></option></template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5" x-text="u('doseLabel')"></label>
                        <select x-model="calcDose" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl p-3">
                            <template x-for="o in doseOptions" :key="o.v"><option :value="o.v" :selected="o.v === calcDose" x-text="o.t"></option></template>
                        </select>
                    </div>

                    <div class="pt-4 border-t border-slate-700">
                        <h3 class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-kidneys mr-1"></i><span x-text="u('calcStep2')"></span></h3>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5" x-text="u('egfrLabel')"></label>
                        <input type="number" min="0" max="200" x-model="calcEgfr" placeholder="25" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl p-3">
                        <p class="text-[10px] text-slate-400 mt-1" x-text="u('egfrHint')"></p>
                        <label class="flex items-center gap-2 mt-3 text-xs text-slate-200 cursor-pointer">
                            <input type="checkbox" x-model="dialysis" class="accent-rose-500"> <span x-text="u('dialysis')"></span>
                        </label>
                    </div>

                    <div class="pt-4 border-t border-slate-700">
                        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-capsules mr-1"></i><span x-text="u('calcStep3')"></span></h3>
                        <div class="space-y-2 text-xs text-slate-200">
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" x-model="fCyclosporin" class="accent-rose-500"><span x-text="u('fCyclosporin')"></span></label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" x-model="fGemfibrozil" class="accent-rose-500"><span x-text="u('fGemfibrozil')"></span></label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" x-model="fCyp3a4" class="accent-rose-500"><span x-text="u('fCyp3a4')"></span></label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" x-model="fAsian" class="accent-rose-500"><span x-text="u('fAsian')"></span></label>
                        </div>
                    </div>
                </div>

                <!-- Kết quả -->
                <div class="lg:col-span-7 bg-slate-900 rounded-xl p-5 border border-slate-700 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30">
                                <i class="fa-solid fa-arrows-rotate mr-1"></i><span x-text="u('analysis')"></span>
                            </span>
                            <span class="text-xs font-extrabold text-slate-300" x-text="calc.title"></span>
                        </div>

                        <div class="p-3.5 rounded-xl border flex items-center gap-3 mb-3" :class="calc.intensityClass">
                            <div class="text-2xl"><i class="fa-solid fa-chart-line"></i></div>
                            <div>
                                <div class="text-[10px] font-bold uppercase opacity-80" x-text="u('intensityTitle')"></div>
                                <div class="text-sm font-black" x-text="calc.intensityText"></div>
                                <div class="text-[11px] opacity-90" x-text="calc.pctText"></div>
                            </div>
                        </div>

                        <div class="p-3.5 rounded-xl border text-xs leading-relaxed mb-4" :class="calc.checkClass">
                            <strong class="block font-bold text-sm mb-1"><i class="fa-solid fa-shield-halved mr-1"></i><span x-text="u('safetyTitle')"></span></strong>
                            <p x-text="calc.checkText"></p>
                            <ul class="list-disc ml-4 mt-1.5 space-y-0.5">
                                <template x-for="(n, i) in calc.notes" :key="i"><li x-text="n"></li></template>
                            </ul>
                        </div>

                        <div class="bg-slate-800/90 rounded-xl p-4 border border-slate-700">
                            <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2.5 pb-1.5 border-b border-slate-700">
                                <i class="fa-solid fa-scale-balanced text-amber-400 mr-1"></i><span x-text="u('equivTitle')"></span>
                            </h4>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 text-xs">
                                <template x-for="item in calc.equivalents" :key="item.id">
                                    <div class="p-2.5 rounded-lg bg-slate-900/80 border flex flex-col" :class="item.border">
                                        <span class="text-[10px] font-bold uppercase text-slate-400" x-text="item.name"></span>
                                        <span class="text-sm font-extrabold" :class="item.color" x-text="item.dose"></span>
                                        <span class="text-[10px] text-slate-300" x-text="item.pct"></span>
                                        <span class="text-[9px] mt-0.5" :class="item.tagColor" x-text="item.tag"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    <p class="text-[11px] text-slate-400 italic mt-3 leading-relaxed" x-text="u('calcNote')"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- ============ TƯ VẤN LÂM SÀNG ============ -->
    <section x-show="activeView === 'helper'" class="space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 card-shadow">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-2xl"><i class="fa-solid fa-user-doctor"></i></div>
                <div>
                    <h2 class="text-xl font-bold text-white" x-text="u('helperTitle')"></h2>
                    <p class="text-xs text-slate-400" x-text="u('helperSub')"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <template x-for="sc in scenarioList" :key="sc.id">
                    <button @click="activeScenario = sc.id"
                            :class="activeScenario === sc.id ? 'border-rose-500 bg-rose-500/10' : 'border-slate-700 bg-slate-800/60 hover:bg-slate-800'"
                            class="p-4 rounded-xl border text-left transition flex flex-col justify-between">
                        <div>
                            <div :class="sc.iconBg" class="w-8 h-8 rounded-lg flex items-center justify-center mb-2"><i :class="sc.icon"></i></div>
                            <h4 class="font-bold text-sm text-slate-200" x-text="sc.title[lang]"></h4>
                            <p class="text-xs text-slate-400 mt-1" x-text="sc.short[lang]"></p>
                        </div>
                        <span class="mt-3 text-[11px] font-bold text-rose-400" x-text="u('viewRec')"></span>
                    </button>
                </template>
            </div>

            <div class="bg-slate-800/90 border border-rose-500/40 rounded-2xl p-6 text-slate-200">
                <span class="px-2.5 py-1 rounded bg-rose-500/20 text-rose-300 text-xs font-bold uppercase tracking-wider" x-text="u('optimalRec')"></span>
                <h3 class="text-lg font-bold text-white mt-3 mb-2" x-text="scenarioData.title[lang]"></h3>
                <p class="text-sm text-slate-300 mb-4" x-text="scenarioData.desc[lang]"></p>

                <div class="bg-slate-900 rounded-xl p-4 border border-slate-700 space-y-4">
                    <div class="flex items-start gap-3">
                        <i class="fa-solid fa-star text-amber-400 text-lg mt-0.5"></i>
                        <div>
                            <strong class="text-sm text-amber-300 block" x-text="u('preferred')"></strong>
                            <span class="text-base font-extrabold text-white" x-text="scenarioData.preferred[lang]"></span>
                            <p class="text-xs text-slate-300 mt-1 leading-relaxed" x-text="scenarioData.why[lang]"></p>
                        </div>
                    </div>
                    <div class="border-t border-slate-800 pt-3 flex items-start gap-3">
                        <i class="fa-solid fa-circle-info text-sky-400 text-lg mt-0.5"></i>
                        <div>
                            <strong class="text-sm text-sky-300 block mb-1" x-text="u('rationale')"></strong>
                            <ul class="list-disc ml-4 space-y-1.5 text-xs text-slate-300 leading-relaxed">
                                <template x-for="(p, i) in scenarioData.points[lang]" :key="i"><li x-text="p"></li></template>
                            </ul>
                        </div>
                    </div>
                    <p class="text-[11px] text-slate-500 border-t border-slate-800 pt-2" x-text="u('refsShort') + ' ' + scenarioData.refs"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- ============ TRẮC NGHIỆM ============ -->
    <section x-show="activeView === 'quiz'" class="space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 card-shadow">
            <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl"><i class="fa-solid fa-graduation-cap"></i></div>
                    <div>
                        <h2 class="text-xl font-bold text-white" x-text="u('quizTitle')"></h2>
                        <p class="text-xs text-slate-400" x-text="u('quizSub')"></p>
                    </div>
                </div>
                <div class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold text-rose-300 border border-slate-700">
                    <span x-text="u('score') + ': '"></span><span class="text-lg text-white" x-text="quizScore"></span> / <span x-text="quizQuestions.length"></span>
                </div>
            </div>

            <div x-show="currentQuestionIndex < quizQuestions.length" class="space-y-6">
                <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700">
                    <div class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2" x-text="u('question') + ' ' + (currentQuestionIndex + 1) + ' / ' + quizQuestions.length"></div>
                    <h3 class="text-base font-bold text-white" x-text="currentQ.q[lang]"></h3>
                </div>
                <div class="grid grid-cols-1 gap-3">
                    <template x-for="(opt, oIdx) in currentQ.options" :key="oIdx">
                        <button @click="answerQuiz(oIdx)" :disabled="quizAnswered"
                                :class="{
                                    'bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700': !quizAnswered,
                                    'bg-emerald-600 text-white font-bold border-emerald-500': quizAnswered && oIdx === currentQ.correct,

function intensityOf(drug, dose) {
    if (drug === 'atorvastatin') return dose >= 40 ? 'high' : 'moderate';
    if (drug === 'rosuvastatin') return dose >= 20 ? 'high' : 'moderate';
    if (drug === 'simvastatin') return dose <= 10 ? 'low' : 'moderate';
    if (drug === 'lovastatin') return dose <= 20 ? 'low' : 'moderate';
    if (drug === 'pravastatin') return dose <= 20 ? 'low' : 'moderate';
    if (drug === 'fluvastatin') return dose >= 80 ? 'moderate' : 'low';
    return 'moderate'; // pitavastatin 1–4 mg

        /* ---------- Quy đổi liều ---------- */
        get doseOptions() {
            const drug = this.calcDrug;
            return (DOSES[drug] || []).map(d => {
                const lvl = intensityOf(drug, d);
                const lvlTxt = lvl === 'high' ? (this.lang === 'vi' ? 'cường độ cao' : 'high intensity')
                    : lvl === 'moderate' ? (this.lang === 'vi' ? 'cường độ trung bình' : 'moderate intensity')
                    : (this.lang === 'vi' ? 'cường độ thấp' : 'low intensity');
                const pct = LDL[drug][d];
                return { v: String(d), t: d + ' mg/' + (this.lang === 'vi' ? 'ngày' : 'day') + ' — ' + lvlTxt + ' (' + (drug === 'pitavastatin' ? '≈' : '') + pct + '%)' };
            });
        },

        onDrugChange() {
            const list = DOSES[this.calcDrug];
            this.calcDose = String(list[Math.min(1, list.length - 1)]);
        },

        // Đánh giá giới hạn nhãn cho một statin theo bối cảnh hiện tại
        evaluate(drug) {
            const L = this.lang;
            const vi = L === 'vi';
            let status = 'ok', max = null, start = null;
            const notes = [];
            const setMax = (m) => { max = (max === null) ? m : Math.min(max, m); };
            const setStart = (s) => { start = (start === null) ? s : Math.min(start, s); };

            const active = { cyclosporin: this.fCyclosporin, gemfibrozil: this.fGemfibrozil, cyp3a4: this.fCyp3a4, asian: this.fAsian };
            Object.keys(active).forEach(key => {
                if (!active[key]) return;
                const lim = LIMITS[key][drug];
                if (!lim || lim.type === 'none') return;
                const f = FACTORS[key][L];
                if (lim.type === 'contra') {
                    status = 'contra';
                    notes.push(f + ': ' + (vi ? 'chống chỉ định' : 'contraindicated'));
                } else if (lim.type === 'avoid') {
                    if (status !== 'contra') status = 'avoid';
                    notes.push(f + ': ' + (vi ? 'tránh dùng phối hợp' : 'avoid combination'));
                } else if (lim.type === 'cap') {
                    setMax(lim.max);
                    if (lim.start) setStart(lim.start);
                    notes.push(f + ': ' + (vi ? 'tối đa ' : 'max ') + lim.max + ' mg/' + (vi ? 'ngày' : 'day') + (lim.start ? (vi ? ', khởi đầu ' : ', start ') + lim.start + ' mg' : '') + (lim.onlyNote ? ' (' + lim.onlyNote[L] + ')' : ''));
                } else if (lim.type === 'caution') {
                    notes.push(f + ': ' + (vi ? 'tăng nguy cơ bệnh cơ, thận trọng' : 'increased myopathy risk, use caution'));
                }
            });

            // Chức năng thận
            const egfrRaw = parseFloat(this.calcEgfr);
            const egfr = (this.dialysis && isNaN(egfrRaw)) ? 10 : egfrRaw;
            if (!isNaN(egfr)) {
                const sev = egfr < 30;
                const mod = egfr < 60;
                if (drug === 'rosuvastatin' && sev) { setStart(5); setMax(10); notes.push(vi ? 'Suy thận nặng: khởi đầu 5 mg, tối đa 10 mg/ngày' : 'Severe renal impairment: start 5 mg, max 10 mg/day'); }
                if (drug === 'pitavastatin' && (mod || this.dialysis)) { setStart(1); setMax(2); notes.push(vi ? 'Suy thận (eGFR 15–59) hoặc lọc máu: khởi đầu 1 mg, tối đa 2 mg/ngày' : 'Renal impairment (eGFR 15–59) or dialysis: start 1 mg, max 2 mg/day'); }
                if (drug === 'simvastatin' && sev) { setStart(5); notes.push(vi ? 'Suy thận nặng: khởi đầu 5 mg/ngày (nhãn Mỹ không còn viên 5 mg)' : 'Severe renal impairment: start 5 mg/day (5 mg tablet no longer marketed in US)'); }
                if (drug === 'pravastatin' && sev) { setStart(10); notes.push(vi ? 'Suy thận nặng: khởi đầu 10 mg/ngày' : 'Severe renal impairment: start 10 mg/day'); }
                if (drug === 'lovastatin' && sev) { setMax(20); notes.push(vi ? 'ClCr < 30: liều > 20 mg cần cân nhắc kỹ, thận trọng' : 'CrCl < 30: doses > 20 mg need careful consideration'); }
                if (drug === 'fluvastatin' && sev) { setMax(40); notes.push(vi ? 'Suy thận nặng: chưa nghiên cứu liều > 40 mg, thận trọng' : 'Severe renal impairment: doses > 40 mg not studied, use caution'); }
                if (drug === 'atorvastatin' && sev) { notes.push(vi ? 'Không cần chỉnh liều theo chức năng thận' : 'No renal dose adjustment required'); }
            }
            return { status, max, start, notes };
        },

        get calc() {
            const vi = this.lang === 'vi';
            const drug = this.calcDrug;
            const dose = parseInt(this.calcDose, 10);
            const table = LDL[drug];
            if (!table || table[dose] === undefined) {
                return { title: '', intensityText: '', intensityClass: 'bg-slate-800 border-slate-700 text-slate-300', pctText: '', checkText: '', checkClass: 'bg-slate-800 border-slate-700 text-slate-300', notes: [], equivalents: [] };
            }
            const S = table[dose];
            const approx = drug === 'pitavastatin' ? '≈' : '';
            const lvl = intensityOf(drug, dose);
            const intensityText = lvl === 'high' ? this.u('intHigh') : lvl === 'moderate' ? this.u('intMod') : this.u('intLow');
            const intensityClass = lvl === 'high' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40'
                : lvl === 'moderate' ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                : 'bg-sky-500/20 text-sky-300 border-sky-500/40';

            // Kiểm tra liều hiện tại
            const ev = this.evaluate(drug);
            let checkText, checkClass;
            const bad = 'bg-rose-500/20 border-rose-500/50 text-rose-200';
            const warn = 'bg-amber-500/10 border-amber-500/30 text-amber-300';
            const good = 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300';
            if (ev.status === 'contra') {
                checkText = vi ? 'CHỐNG CHỈ ĐỊNH với thuốc/yếu tố đã chọn. Cần đổi thuốc.' : 'CONTRAINDICATED with the selected drug/factor. Switch agent.';
                checkClass = bad;
            } else if (ev.status === 'avoid') {
                checkText = vi ? 'Nhãn thuốc khuyến cáo TRÁNH dùng phối hợp này. Cân nhắc đổi thuốc.' : 'The label advises AVOIDING this combination. Consider switching agent.';
                checkClass = bad;
            } else if (ev.max !== null && dose > ev.max) {
                checkText = (vi ? 'VƯỢT giới hạn theo nhãn: tối đa ' : 'EXCEEDS label limit: max ') + ev.max + ' mg/' + (vi ? 'ngày' : 'day') + '.';
                checkClass = bad;
            } else if (ev.notes.length > 0) {
                checkText = vi ? 'Liều hiện tại nằm trong giới hạn, cần lưu ý:' : 'Current dose is within limits; note:';
                checkClass = warn;
            } else {
                checkText = vi ? 'Không có giới hạn đặc biệt theo các yếu tố đã chọn. Nhập eGFR/ClCr hoặc chọn thuốc dùng kèm để kiểm tra thêm.' : 'No special limit for the selected factors. Enter eGFR/CrCl or select co-medications to check further.';
                checkClass = good;
            }
            const notes = ev.notes.slice();
            if (ev.start !== null && ev.status !== 'contra' && ev.status !== 'avoid') {
                notes.push((vi ? 'Liều khởi đầu khuyến cáo trong bối cảnh này: ' : 'Recommended starting dose in this context: ') + ev.start + ' mg/' + (vi ? 'ngày' : 'day'));
            }

            // Liều gần tương đương
            const equivalents = Object.keys(DOSES).filter(id => id !== drug).map(id => {
                const e = this.evaluate(id);
                const base = { id: id, name: NAMES[id], color: EQUIV_STYLE[id] };
                if (e.status === 'contra' || e.status === 'avoid') {
                    return Object.assign(base, {
                        dose: e.status === 'contra' ? this.u('kContra') : this.u('kAvoid'), pct: '—',
                        border: 'border-rose-500/40', tag: e.notes.join('; '), tagColor: 'text-rose-300'
                    });
                }
                const doses = DOSES[id].filter(d => e.max === null || d <= e.max);
                if (doses.length === 0) {
                    return Object.assign(base, { dose: this.u('kNoDose'), pct: '—', border: 'border-rose-500/40', tag: e.notes.join('; '), tagColor: 'text-rose-300' });
                }
                let best = doses[0];
                doses.forEach(d => { if (Math.abs(LDL[id][d] - S) < Math.abs(LDL[id][best] - S)) best = d; });
                const got = LDL[id][best];
                const gap = S - got;
                const ap = id === 'pitavastatin' ? '≈' : '';
                let tag, tagColor, border;
                if (gap > 5) { tag = this.u('kShort'); tagColor = 'text-rose-300'; border = 'border-rose-500/40'; }
                else if (gap > 3) { tag = this.u('kNearLow'); tagColor = 'text-amber-300'; border = 'border-amber-500/40'; }
                else if (gap < -3) { tag = this.u('kNearHigh'); tagColor = 'text-amber-300'; border = 'border-amber-500/40'; }
                else { tag = this.u('kMatch'); tagColor = 'text-emerald-300'; border = 'border-slate-700/80'; }
                if (e.notes.length > 0 && e.max !== null) { tag += ' · ' + (vi ? 'trần ' : 'cap ') + e.max + ' mg'; }
                return Object.assign(base, { dose: best + ' mg', pct: ap + got + '%', border: border, tag: tag, tagColor: tagColor });
            });

            return {
                title: NAMES[drug] + ' ' + dose + ' mg/' + (vi ? 'ngày' : 'day'),
                intensityText: intensityText,
                intensityClass: intensityClass,
                pctText: this.u('expectedLdl') + ': ' + approx + S + '%',
                checkText: checkText,
                checkClass: checkClass,
                notes: notes,
                equivalents: equivalents
            };
        },
