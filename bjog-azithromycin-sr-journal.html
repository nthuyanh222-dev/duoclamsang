<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuitunen BJOG 2024 – Thẩm định EBM</title>
<meta name="description" content="Tóm tắt trực quan thẩm định EBM tổng quan hệ thống kèm gộp phân tích (BJOG 2024): azithromycin liều đơn trong chuyển dạ, 5 RCT, 44.190 sản phụ. Kết quả gộp, độ chắc chắn bằng chứng, điểm cần đối chiếu, tình huống, trắc nghiệm.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme=light]{--bg:#eef1f8;--surf:#fff;--surf2:#f6f7fc;--tx:#101828;--mut:#475467;--line:#d9deea;--ind:#3a2fa0;--ind2:#5a4fe0;--indbg:#ecebfd;--ok:#0b6b45;--okbg:#e2f5eb;--warn:#7a4e00;--warnbg:#fff2d2;--bad:#a61f14;--badbg:#fde8e6;--info:#124fb5;--infobg:#e4eeff;--ref:#8a93a8;--bar:#c9cfdf;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05)}
[data-theme=warm]{--bg:#f6f0e6;--surf:#fffdf8;--surf2:#faf4e8;--tx:#2a2118;--mut:#5f5444;--line:#e3d8c4;--ind:#5b3a1a;--ind2:#a0602a;--indbg:#f3e6d2;--ok:#2d6a3a;--okbg:#e5f1df;--warn:#7a4a00;--warnbg:#fbeac0;--bad:#9b2a1a;--badbg:#f9e0d8;--info:#1f5a86;--infobg:#e1edf5;--ref:#948872;--bar:#d6c9b0}
[data-theme=dark]{--bg:#0f1220;--surf:#171b2e;--surf2:#1d2238;--tx:#e8ebf7;--mut:#a7aec8;--line:#2d3452;--ind:#a9a2ff;--ind2:#8c84ff;--indbg:#25244a;--ok:#6fd8a4;--okbg:#12342a;--warn:#f4c768;--warnbg:#3b2e10;--bad:#ff9d92;--badbg:#401c19;--info:#8ab9ff;--infobg:#172a4a;--ref:#7f88a6;--bar:#3a4264;--shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 28px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ind2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1120px;margin:0 auto;padding:14px 16px}
.brand{font-weight:800;font-size:1.05rem}.brand span{color:var(--ind);font-weight:700}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-size:.84rem;font-weight:700;cursor:pointer;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--ind);color:#fff}
[data-theme=dark] .seg button[aria-pressed=true]{color:#0f1220}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:7px 12px;font-size:.84rem;font-weight:700;cursor:pointer}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.hero{border-top:5px solid var(--ind2)}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ind)}
h1{margin:6px 0 10px;font-size:1.55rem;line-height:1.25;color:var(--ind)}
h2{margin:0 0 4px;font-size:1.15rem;color:var(--ind)}
h3{margin:0 0 6px;font-size:.98rem}
.sub{margin:0 0 14px;color:var(--mut);font-size:.88rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--indbg);color:var(--ind);font-weight:700;font-size:.78rem;border-radius:999px;padding:3px 11px}
.steps{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 0 6px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.steps button{flex:1 1 0;min-width:138px;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:.85rem;line-height:1.25}
.steps .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--indbg);color:var(--ind);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.steps button[aria-selected=true]{background:var(--ind);color:#fff;border-color:var(--ind)}
[data-theme=dark] .steps button[aria-selected=true]{color:#0f1220}
.steps button[aria-selected=true] .n{background:#fff;color:var(--ind)}
.panel[hidden]{display:none}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mini{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pg{display:inline-block;font-size:.7rem;color:var(--ref);font-weight:600;margin-left:6px;white-space:nowrap}
.pgb{display:block;font-size:.7rem;color:var(--ref);font-weight:600;margin-top:4px}
dl.di{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin:0}
dl.di div{padding:7px 0;border-bottom:1px solid var(--line);min-width:0}
dl.di dt{font-size:.74rem;font-weight:800;color:var(--ind);text-transform:uppercase;letter-spacing:.03em}
dl.di dd{margin:1px 0 0;font-size:.86rem;overflow-wrap:anywhere}
.tile{background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .lb{font-size:.76rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.tile .big{font-size:2.3rem;font-weight:800;color:var(--ind);line-height:1.1;margin:6px 0 2px}
.tile .nt{font-size:.8rem;color:var(--mut)}
.duo{display:flex;gap:12px;align-items:flex-end;margin:6px 0 2px}
.duo div{flex:1}.duo b{display:block;font-size:1.7rem;line-height:1.1}.duo small{font-size:.72rem;color:var(--mut);font-weight:700}
.duo .a b{color:var(--ind)}.duo .b b{color:var(--mut)}
.quick{margin:0;padding-left:20px}.quick li{margin:6px 0}
.pico{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pico .mini{position:relative;padding-top:34px}
.pico .k{position:absolute;top:-1px;left:-1px;background:var(--ind);color:#fff;font-weight:800;border-radius:12px 0 12px 0;width:34px;height:30px;display:grid;place-items:center}
[data-theme=dark] .pico .k{color:#0f1220}
.pico h3{font-size:.86rem;color:var(--ind);margin-bottom:3px}
.pico p{margin:0;font-size:.84rem}
ul.cr{margin:6px 0 0;padding-left:18px;font-size:.84rem}ul.cr li{margin:4px 0}
.cr-h{font-weight:800;font-size:.84rem}
.cr-y .cr-h{color:var(--ok)}.cr-n .cr-h{color:var(--bad)}
.flow{display:flex;flex-direction:column;gap:0;align-items:center}
.fnode{width:min(560px,100%);border:1px solid var(--line);background:var(--surf2);border-radius:12px;padding:8px 14px;text-align:center}
.fnode .fn{font-size:1.25rem;font-weight:800;color:var(--ind)}.fnode .ft{font-size:.78rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}.fnode .fs{font-size:.78rem;color:var(--mut);margin-top:2px}
.fnode.side{background:var(--surf);border-style:dashed;width:min(560px,100%)}
.farrow{height:16px;width:2px;background:var(--bar);margin:0 auto}
.fnode.last{border:2px solid var(--ind2)}
.rob{display:grid;gap:8px}
.robrow{display:grid;grid-template-columns:230px 150px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surf2)}
.robrow .d{font-weight:700}.robrow p{margin:0;font-size:.84rem}
.jb{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:800;white-space:nowrap}
.jb.low{background:var(--okbg);color:var(--ok)}.jb.some{background:var(--warnbg);color:var(--warn)}.jb.unk{background:var(--infobg);color:var(--info)}
.ai{display:inline-block;font-size:.68rem;font-weight:800;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:1px 7px;vertical-align:middle;margin-left:6px}
.overall{margin-top:10px;padding:10px 12px;border-left:5px solid var(--ind2);background:var(--indbg);border-radius:8px;font-size:.86rem}
.segf{margin:0 0 12px}
.abs{display:grid;gap:6px;margin:6px 0 4px}
.absr{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:10px;font-size:.84rem}
.track{background:var(--surf2);border:1px solid var(--line);border-radius:6px;height:20px;overflow:hidden}
.track i{display:block;height:100%}
.absr.az i{background:var(--ind2)}.absr.pl i{background:var(--bar)}
.forest{margin:8px 0 0}
.fh,.fr{display:grid;grid-template-columns:minmax(0,1.5fr) 98px 98px 240px 100px 116px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.fh{font-size:.72rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:0;border-bottom:2px solid var(--line)}
.fr.key{background:var(--indbg);border-radius:8px}
.fr .c-l b{font-weight:700;font-size:.88rem}
.c-a,.c-b{font-size:.82rem;line-height:1.25}.c-a .pc,.c-b .pc{display:block;color:var(--mut);font-size:.74rem}
.c-v{font-weight:800;font-size:.88rem}.c-v small{display:block;font-weight:600;color:var(--mut);font-size:.74rem}
.c-p{font-size:.8rem}.c-p .sg{display:block;font-weight:800;font-size:.72rem;margin-top:1px}
.sg.sig{color:var(--ok)}.sg.ns{color:var(--mut)}
.na{font-size:.76rem;color:var(--mut);font-style:italic}
.lowev{display:inline-block;font-size:.66rem;font-weight:800;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
.fsv{display:block;width:100%;height:26px}
.fsv .ref{stroke:var(--mut);stroke-width:1;stroke-dasharray:3 2}
.fsv .ci{stroke:var(--ind2);stroke-width:2}
.fsv .cap{stroke:var(--ind2);stroke-width:2}
.fsv .pt.sig{fill:var(--ind2);stroke:var(--ind2)}.fsv .pt.ns{fill:var(--surf);stroke:var(--ind2);stroke-width:2}
.ax{display:block;width:100%;height:22px}.ax line{stroke:var(--mut);stroke-width:1}.ax text{fill:var(--mut);font-size:9px;text-anchor:middle}
.axl{display:flex;justify-content:space-between;font-size:.66rem;color:var(--mut);font-weight:700;margin-bottom:1px;text-transform:none;letter-spacing:0}
.fx{display:grid;grid-template-columns:minmax(0,1.5fr) 98px 98px 240px 100px 116px;gap:8px;padding:2px 4px}.fxa{grid-column:4}
.fnote{font-size:.8rem;color:var(--mut);margin:10px 0 0}
.mini h3{font-size:.9rem}.mini p{margin:0;font-size:.84rem}
.nnt{text-align:center}.nnt .v{font-size:1.9rem;font-weight:800;color:var(--ind);line-height:1.1}.nnt .ci{font-size:.78rem;color:var(--mut)}
.vl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.vl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);background:var(--surf2);border-radius:12px;padding:10px 12px;font-size:.86rem}
.tag{font-size:.7rem;font-weight:800;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag.t{background:var(--infobg);color:var(--info)}.tag.a{background:var(--warnbg);color:var(--warn)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.cmp div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem;background:var(--surf)}
.cmp b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ind)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.form label{display:grid;gap:3px;font-size:.78rem;font-weight:700;color:var(--mut)}
.form input{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:9px;padding:7px 9px;font-size:.92rem;font-family:inherit}
.est{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0}
.est div{background:var(--indbg);border-radius:10px;padding:9px 11px;font-weight:800;font-size:1.05rem;color:var(--ind)}
.est small{display:block;font-weight:600;font-size:.7rem;color:var(--mut)}
.warnx{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:.84rem;font-weight:700}
.note{font-size:.78rem;color:var(--mut);margin:6px 0 0}
details.case{border:1px solid var(--line);border-radius:12px;background:var(--surf2);margin-bottom:8px}
details.case summary{cursor:pointer;padding:10px 14px;font-weight:700}
details.case table{width:100%;border-collapse:collapse;font-size:.84rem}
details.case td{padding:7px 14px;border-top:1px solid var(--line);vertical-align:top}
details.case td:first-child{width:120px;font-weight:800;color:var(--ind)}
.q{border:1px solid var(--line);border-radius:12px;background:var(--surf2);padding:12px 14px;margin-bottom:10px}
.q p{margin:0 0 8px;font-weight:700}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surf);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:.86rem;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.ex{font-size:.82rem;color:var(--mut);margin:6px 0 0}
table.gl{width:100%;border-collapse:collapse;font-size:.84rem}
table.gl th,table.gl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.gl th{color:var(--ind);font-size:.76rem;text-transform:uppercase}
ol.src{margin:0;padding-left:20px;font-size:.86rem}
ul.sc{margin:0;padding-left:20px;font-size:.84rem}ul.sc li{margin:5px 0}
footer{max-width:1120px;margin:0 auto;padding:6px 16px 28px;font-size:.8rem;color:var(--mut)}
footer .ail{font-weight:800;color:var(--warn);background:var(--warnbg);display:inline-block;padding:5px 10px;border-radius:8px;margin-bottom:6px}

/*SKIN*/
:root,[data-theme=light]{--bg1:#a9b5c9;--bg2:#c4ccda;--bg:#c4ccda;--cardbg:#eef1f6;--cardbd:#aab6c9;--card2:#dfe5ee;--surf:#fff;--surf2:#f4f6fb;--tx:#0a1020;--mut:#2f3d54;--line:#d7deea;--ind:#3730a3;--ind2:#4f46e5;--indbg:#e0e7ff;--ok:#14532d;--okbg:#dcfce7;--warn:#713f12;--warnbg:#fef3c7;--bad:#7f1d1d;--badbg:#fee2e2;--info:#1e3a8a;--infobg:#dbeafe;--ref:#4a5a73;--bar:#b7c1d6;--navy:#17407e;--shadow:0 6px 20px rgba(10,16,32,.10)}
[data-theme=warm]{--bg1:#e6d8bb;--bg2:#f3ead6;--bg:#f3ead6;--cardbg:#fbf5e8;--cardbd:#d4c4a1;--card2:#f0e6d0;--surf:#fffdf7;--surf2:#f8f1e1;--tx:#2a2116;--mut:#5a4a33;--line:#e6d9bb;--ind:#7a3f0a;--ind2:#a0602a;--indbg:#f1e3c4;--ref:#6b5a40;--bar:#d6c9b0;--navy:#7a4a12}
[data-theme=dark]{--bg1:#0b1220;--bg2:#111a2e;--bg:#111a2e;--cardbg:#16213a;--cardbd:#33466b;--card2:#1e2b4a;--surf:#1b2a4a;--surf2:#203154;--tx:#e8edf8;--mut:#b4c0d8;--line:#2f4064;--ind:#c7d2fe;--ind2:#6366f1;--indbg:#2a3a66;--ref:#93a3c4;--bar:#3a4a78;--ok:#bbf7d0;--okbg:#12361f;--warn:#fde68a;--warnbg:#3a2d0b;--bad:#fecaca;--badbg:#3d1620;--info:#bfdbfe;--infobg:#14284f;--navy:#3b5bdb;--shadow:0 6px 20px rgba(0,0,0,.35)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));background-color:var(--bg2);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;padding:0 16px 20px}
.top{max-width:1360px;padding:14px 16px 12px}
.brand{font-size:1.15rem;letter-spacing:-.01em}.brand span{font-size:.95rem}
.seg{background:var(--cardbg);border-color:var(--cardbd)}
.seg button{display:flex;align-items:center;gap:7px;color:var(--tx)}
.seg button[aria-pressed=true],[data-theme=dark] .seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(10,16,32,.35);display:inline-block}
.dot.l{background:#fff}.dot.w{background:#e6d9b8}.dot.d{background:#1a2238}
.seg button[aria-pressed=true] .dot{border-color:#fff}
.btn{background:var(--surf);border-color:var(--cardbd)}
.card{background:var(--cardbg);border:1px solid var(--cardbd);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px}
.card h2,.card h3{color:var(--ind)}
.hero{position:relative;overflow:hidden;border-top:1px solid var(--cardbd);padding:26px 18px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#2f5bea,#7c3aed,#d97706,#0f766e,#475569,#be185d)}
.hero .eyebrow{width:100%}
.hero .ico{width:56px;height:56px;flex:none}
.hero .hb{flex:1;min-width:240px}
h1{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;margin:0 0 8px}
.ico3{display:block;width:100%;height:100%}
.ainote{margin:0 0 14px;background:var(--warnbg);border:1px solid #fcd34d;color:var(--warn);border-radius:12px;padding:10px 14px;font-size:.82rem;font-weight:600}
[data-theme=dark] .ainote{border-color:#7c5e12}
.chip{background:var(--indbg);color:var(--ind);border:1px solid var(--cardbd)}
.steps{background:transparent;gap:8px;flex-wrap:wrap;overflow:visible;position:static;padding:0;margin:0 0 14px}
.steps button{flex:0 1 auto;min-width:0;background:var(--card2);border:1px solid var(--cardbd);border-radius:14px;padding:6px 14px 6px 6px;gap:8px;color:var(--tx);font-family:inherit}
.steps button .ico{width:34px;height:34px;flex:none}
.steps button small{display:block;font-size:.66rem;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.steps button:hover:not([aria-selected=true]){background:var(--surf)}
.steps button[aria-selected=true],[data-theme=dark] .steps button[aria-selected=true]{background:var(--ind2);border-color:var(--ind);color:#fff;box-shadow:0 4px 14px rgba(55,48,163,.35)}
.steps button[aria-selected=true] small{color:#e0e7ff}
.tile .tx{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:.8rem;line-height:1.45;color:var(--tx)}
.mini,.tile,.robrow,.vl li,.fnode,.q,details.case,.cmp div{background:var(--surf);border-color:var(--line)}
.fnode.side{background:var(--surf2)}
.tile{box-shadow:0 2px 8px rgba(10,16,32,.06)}
.est div{background:var(--indbg)}
.pico .k{background:var(--ind2);color:#fff}
.forest{background:var(--surf);border:1px solid var(--cardbd);border-radius:14px;overflow:hidden;margin-top:10px}
.fh{background:var(--ind2);color:#fff;border-bottom:0;padding:9px 8px;font-size:.74rem}
.fh .axl,.fh .ax text{color:#fff;fill:#fff}.fh .ax line{stroke:#fff}
.fr,.fx{padding-left:8px;padding-right:8px}
.fr:nth-of-type(even){background:var(--surf2)}
.fr.key{background:var(--indbg)}
.fr{border-bottom:1px solid var(--line)}
.segf{background:var(--cardbg)}
.overall{background:var(--indbg)}
.track{background:var(--surf);border-color:var(--cardbd)}
.absr.az i{background:var(--ind2)}
.ai{background:var(--warnbg);color:var(--warn);border:1px solid #fcd34d}
table.gl th{background:var(--ind2);color:#fff;font-size:.76rem}
table.gl tr:nth-child(even) td{background:var(--surf2)}
.jb,.tag,.lowev{border:1px solid rgba(10,16,32,.10)}

ễm khuẩn vết mổ", "v": "khoảng 83", "ci": "ước tính 56–333"}], "nnt_pg": "tr. 251 (Bảng 2)", "nnt_note": "Bài không nêu NNT. AI tính NNT = 1000 / số ca ít hơn trên 1000 sản phụ trong Bảng 2 (8; 6; 12) và tính cận từ khoảng tin cậy của số ca ít hơn (6–10; 4–8; 3–18). Đây chỉ là ước lượng cho kết quả gộp ở nguy cơ nền của các nghiên cứu, không nên áp dụng trực tiếp cho cơ sở có nguy cơ nền khác.", "sens": {"t": "Phân tích độ nhạy", "pg": "tr. 249, 250", "items": [{"t": "Loại thử nghiệm lớn nhất (A-PLUS)", "x": "Nhiễm khuẩn huyết mẹ đổi thành RR 0,75 (95% CI 0,46–1,23), tức không còn ý nghĩa. Tính lại từ Hình 3 cho cùng kết quả (0,75; 0,46–1,23). Các ước lượng ở mẹ còn lại hầu như không đổi (Hình S3)."}, {"t": "Loại nghiên cứu ở Hoa Kỳ (C/SOAP)", "x": "Không đổi đáng kể ở cả kết cục mẹ và sơ sinh (Hình S2, S5; chưa đọc)."}, {"t": "Loại nghiên cứu chỉ mổ lấy thai, đường tĩnh mạch", "x": "Ước lượng cho chuyển dạ và đường uống không đổi đáng kể (Hình S2, S5; chưa đọc)."}, {"t": "Kết cục sơ sinh, loại từng nghiên cứu", "x": "Không nghiên cứu nào làm đổi ước lượng (Hình S6; chưa đọc)."}]}, "micro": [{"t": "Biến cố bất lợi ở mẹ", "x": "Không gộp được. Roca 2023: nôn 10,1% so với 6,1%, phù 4,2% so với 3,2% (nhiều hơn ở nhóm azithromycin). Subramaniam 2021: nôn 1,6% so với 1,2%. Tita 2016: không khác biệt. Oluwalana 2017: không có biến cố nặng liên quan, không nêu chi tiết.", "pg": "tr. 251"}, {"t": "Hẹp môn vị ở trẻ", "x": "Roca 2023: không có ca. Tita 2023: 8 trẻ (0,05%) nhóm azithromycin so với 3 trẻ (0,02%) nhóm giả dược. Quá hiếm nên các nghiên cứu không đủ lực mẫu.", "pg": "tr. 251"}, {"t": "Hệ vi sinh và hậu quả lâu dài (bàn luận)", "x": "Tác giả nêu nguy cơ chưa được đánh giá: thay đổi hệ vi sinh ở trẻ, kháng thuốc, liên quan hen, dị ứng, béo phì ở nghiên cứu quan sát với kháng sinh trong chuyển dạ. Hiện chưa có nghiên cứu nào theo dõi trẻ sau phơi nhiễm azithromycin trong chuyển dạ.", "pg": "tr. 252"}], "subgroup": [{"t": "Theo đường sinh (đã dự kiến, không thực hiện được)", "x": "Kế hoạch ban đầu phân nhóm theo sinh đường âm đạo, mổ chủ động, mổ không chủ động, nhưng dữ liệu gốc không đủ chi tiết. Tác giả coi đây là hạn chế rõ và là một nguồn không đồng nhất.", "pg": "tr. 253"}, {"t": "Theo nước và khu vực", "x": "Phân nhóm theo thu nhập quốc gia đã dự kiến nhưng kết quả không báo cáo riêng. Thảo luận nêu A-PLUS cho lợi ích ở châu Phi nhiều hơn ở châu Á, và lợi ích với nhiễm khuẩn vết mổ rõ hơn sau mổ lấy thai.", "pg": "tr. 251"}], "nsub": 0, "cases": [{"t": "1. Mổ lấy thai không theo kế hoạch trong chuyển dạ", "rows": [["Giả định", "Thai đơn đủ tháng, mổ lấy thai trong chuyển dạ, đã dự phòng kháng sinh chuẩn, không dị ứng macrolid."], ["Theo bài báo", "Dữ liệu cho tình huống này chỉ có từ C/SOAP (azithromycin 500 mg tĩnh mạch). Gộp lại, nhiễm khuẩn vết mổ giảm (RR 0,52), viêm nội mạc tử cung giảm (RR 0,64)."], ["Lưu ý", "Lợi ích rõ hơn sau mổ lấy thai theo tác giả (tr. 251). Tổng quan không cho biết liều đường uống có tương đương hay không."], ["Cần thẩm định", "Đối chiếu phác đồ dự phòng kháng sinh mổ lấy thai của bệnh viện; azithromycin tĩnh mạch và dùng cho chỉ định này tại Việt Nam có ngoài chỉ định đã đăng ký (off-label) hay không."]]}, {"t": "2. Sinh đường âm đạo, nguy cơ nhiễm khuẩn thấp", "rows": [["Giả định", "Sản phụ đủ tháng sinh thường, không vỡ ối kéo dài, không yếu tố nguy cơ nhiễm khuẩn."], ["Theo bài báo", "Bằng chứng chủ yếu từ A-PLUS (2 g uống), nhiễm khuẩn huyết mẹ giảm RR 0,66. Nguy cơ nền chỉ khoảng 1,7%, nên NNT ước tính khoảng 167."], ["Lưu ý", "Không có lợi ích cho trẻ sơ sinh. Tác giả khuyến nghị cân nhắc nguy cơ kháng thuốc và nên nhắm vào nhóm nguy cơ cao (ví dụ mổ không chủ động) thay vì dùng rộng rãi."], ["Cần thẩm định", "So sánh nguy cơ nền nhiễm khuẩn huyết mẹ tại BVĐK Phương Nam với 1,7% của bài; ý kiến Hội đồng Thuốc và Điều trị về nguy cơ đề kháng."]]}, {"t": "3. Trẻ sơ sinh có mẹ đã dùng azithromycin trong chuyển dạ", "rows": [["Giả định", "Mẹ được dùng 2 g azithromycin đường uống trong chuyển dạ; trẻ sinh đủ tháng."], ["Theo bài báo", "Không thấy khác biệt về tử vong hay nhiễm khuẩn huyết sơ sinh. Hẹp môn vị: 8 so với 3 trẻ trên khoảng 14.700 mỗi nhóm trong A-PLUS, nhưng không đủ lực mẫu."], ["Lưu ý", "Tác giả coi lợi ích cho trẻ là không có và nêu nguy cơ lâu dài (hệ vi sinh, kháng thuốc) là suy đoán chưa được nghiên cứu."], ["Cần thẩm định", "Quy trình theo dõi trẻ phơi nhiễm; đối chiếu nhãn thuốc và hướng dẫn nhi khoa về hẹp môn vị."]]}], "ai_note_cases": "Tình huống do AI soạn dựa trên kết quả của bài, không phải ca có thật.", "calc": {"e1": 15, "n1": 1000, "e2": 23, "n2": 1000, "base": 2.3, "rr": 0.64, "what": "viêm nội mạc tử cung theo Bảng 2 quy ra trên 1000 sản phụ (15 và 23 trên 1000; không phải số ca thật của nghiên cứu)", "pgcalc": "", "base_txt": "2,3"}, "limits": ["Chỉ một trong các nghiên cứu lấy kết cục sơ sinh làm kết cục chính, các nghiên cứu còn lại chủ yếu tập trung vào mẹ", "Không phân tích nhóm con theo đường sinh được, nên khó áp dụng chung cho mọi loại sinh", "Số người rất chênh giữa các nghiên cứu, kết quả bị các thử nghiệm lớn chi phối", "Bối cảnh địa lý khác nhau gây không đồng nhất, kết quả có thể không áp dụng rộng", "Chưa đủ lực mẫu cho tử vong mẹ và viêm màng ối", "Chưa có nghiên cứu về sức khỏe lâu dài của trẻ phơi nhiễm trong chuyển dạ"], "limits_pg": "tr. 252–253", "docinfo": [["Tên bài báo (tổng quan hệ thống và gộp phân tích)", "Intrapartum azithromycin to prevent maternal and neonatal sepsis and deaths: a systematic review and meta-analysis"], ["Nhóm tác giả / tài trợ", "Kuitunen I, Kekki M, Renko M (Đại học Đông Phần Lan, Kuopio, Phần Lan). Tài trợ: không. Xung đột lợi ích: không (tr. 253)"], ["Năm / cập nhật", "BJOG 2024;131(3):246–255 (xuất bản trực tuyến 2023). Tìm kiếm ngày 8/3/2023. Đăng ký PROSPERO CRD42023412194"], ["Thiết kế", "Tổng quan hệ thống kèm gộp phân tích 5 RCT mù đôi đối chứng giả dược; mô hình hiệu ứng ngẫu nhiên Mantel–Haenszel; báo cáo theo PRISMA 2020"], ["Hệ thống phân mức", "Độ chắc chắn bằng chứng theo GRADE do tác giả đánh giá cho từng kết cục (Bảng 2); nguy cơ sai lệch từng RCT theo RoB 2 (Hình 2). Không có mức khuyến cáo"], ["Phạm vi đã trích", "Toàn bộ 10 trang PDF (trang in 246–255; trang in = trang PDF + 245). Phụ lục (Appendix S1, Bảng S1, Hình S1–S6) và bảng kiểm PRISMA không có trong file nên chưa đọc. Số liệu từng nghiên cứu trong Hình 3 và 4 đọc từ hình ảnh rồi tính lại"], ["Lưu ý phiên bản", "Chưa đối chiếu toàn văn từng RCT gốc (C/SOAP, A-PLUS, Roca 2023...), chưa tìm bằng chứng công bố sau 3/2023 và chưa đối chiếu guideline hiện hành"]], "selfcheck": ["Đã đọc cả 10 trang PDF (trang in 246–255) dưới dạng văn bản; Hình 1–4 và Bảng 1–2 đọc lại từ hình ảnh để chép đúng hàng và cột. Kiểm tra tự động 62 cụm từ và số liệu trong văn bản trên đúng trang in: 62 khớp.", "Số liệu từng nghiên cứu ở Hình 3 và 4: 26 giá trị RR đối chiếu; RR tính lại từ số biến cố khớp số trong hình: 26/26 (sai số cho phép 0,015); mọi khoảng tin cậy chứa RR.", "Tổng biến cố và tổng số người cộng từ các nghiên cứu khớp hàng 'Gộp' của hình: 7/7 kết cục; tổng số người khớp Bảng 2 (31.753; 29.781; 31.728; 44.190; 41.289; 44.565).", "RR gộp tính lại bằng DerSimonian–Laird trên logarit RR khớp bài (sai số ≤0,01) ở 7/7 kết cục. Loại A-PLUS khỏi nhiễm khuẩn huyết mẹ tính lại ra RR 0.75 (0.46–1.23), khớp bài (0,75; 0,46–1,23).", "Phần trăm nguy cơ thô trong văn bản khớp tổng biến cố chia tổng số người, trừ tử vong mẹ: bài ghi 0,09%, tính lại 20/20.581 = 0,097% (làm tròn thành 0,10%).", "NNT là AI tính từ Bảng 2, không phải số của bài. Chưa đọc phụ lục nên các phân tích độ nhạy ghi 'chưa đọc' chỉ dựa vào mô tả trong văn bản.", "Chưa đối chiếu các RCT gốc nên chưa kiểm được dữ liệu đầu vào (ví dụ cỡ mẫu Tita 2023, định nghĩa nhiễm khuẩn huyết mẹ giữa các nghiên cứu)."]}, "quiz": [{"q": "Với nhiễm khuẩn huyết ở mẹ, kết quả gộp của tổng quan là gì?", "o": ["RR 0,66 (95% CI 0,56–0,77); độ chắc chắn cao", "RR 0,64 (0,55–0,75); độ chắc chắn cao", "RR 1,26 (0,65–2,42); độ chắc chắn trung bình", "RR 0,94 (0,76–1,16); độ chắc chắn trung bình"], "a": 0, "e": "Nhiễm khuẩn huyết mẹ: 247 so với 376 ca, RR 0,66 (0,56–0,77) từ 5 nghiên cứu (tr. 249, 250, 251). Phương án 2 là viêm nội mạc tử cung, phương án 3 là tử vong mẹ, phương án 4 là tử vong sơ sinh."}, {"q": "Loại thử nghiệm lớn nhất (A-PLUS) khỏi phân tích làm kết quả nhiễm khuẩn huyết mẹ thay đổi thế nào?", "o": ["Không đổi", "RR 0,75 (0,46–1,23), mất ý nghĩa", "RR 0,40 (0,25–0,64), mạnh hơn", "RR 1,26 (0,65–2,42), không có lợi"], "a": 1, "e": "Loại thử nghiệm lớn nhất cho RR 0,75 (0,46–1,23); đây là ước lượng thiếu chính xác (tr. 250). Tính lại từ Hình 3 cho cùng giá trị."}, {"q": "Tổng quan này nên được thẩm định bằng công cụ nào cho nguy cơ sai lệch của từng nghiên cứu được đưa vào?", "o": ["CONSORT", "RoB 2 (Cochrane) cho từng RCT; AMSTAR 2 hoặc ROBIS cho chính bản tổng quan", "STROBE", "PRISMA thay cho RoB 2"], "a": 1, "e": "Bài dùng RoB 2 cho từng RCT (tr. 247). Đánh giá chất lượng của chính tổng quan dùng AMSTAR 2 hoặc ROBIS; PRISMA là bảng kiểm báo cáo, CONSORT dành cho báo cáo RCT, STROBE cho nghiên cứu quan sát."}, {"q": "Vì sao kết cục tử vong mẹ không kết luận được?", "o": ["Tác giả không phân tích kết cục này", "Có 20 so với 16 ca; RR 1,26 với khoảng tin cậy 0,65–2,42 chứa cả lợi ích và tác hại (thiếu lực mẫu)", "Azithromycin làm tăng tử vong có ý nghĩa", "Chỉ có một nghiên cứu báo cáo"], "a": 1, "e": "Tử vong mẹ rất hiếm; khoảng tin cậy rộng nên không loại trừ được cả hai hướng (tr. 250, 252). Kết luận 'có hại rõ' không được số liệu hỗ trợ."}, {"q": "Vì sao nên thận trọng khi áp dụng kết quả này cho Việt Nam?", "o": ["Vì azithromycin chưa từng được thử ở mẹ", "Vì kết quả chủ yếu từ A-PLUS ở nước thu nhập thấp và trung bình, nhiều nghiên cứu ở châu Phi; không phân nhóm theo đường sinh được; lợi ích có vẻ kém hơn ở châu Á", "Vì tất cả nghiên cứu đều dùng đường tĩnh mạch", "Vì tổng quan không đăng ký trước"], "a": 1, "e": "Tác giả nêu kết quả phù hợp nhất cho bối cảnh thu nhập thấp (tr. 252), lợi ích ở châu Phi nhiều hơn châu Á (tr. 251) và không phân nhóm được theo đường sinh (tr. 253). Tổng quan có đăng ký PROSPERO; 4 trong 5 nghiên cứu dùng đường uống."}, {"q": "Điểm nào KHÔNG phải là điểm cần đối chiếu trong bài?", "o": ["Tử vong mẹ ghi 5 nghiên cứu trong văn bản nhưng Hình 3 chỉ có 3", "Kết cục sơ sinh 'trung bình' ở Bảng 2 nhưng 'chất lượng cao' ở Thảo luận", "Tổng quan đã đăng ký PROSPERO", "Câu 'low in all studies' mâu thuẫn với Hình 2"], "a": 2, "e": "Đăng ký PROSPERO CRD42023412194 (tr. 246) là điểm mạnh, không phải điểm cần đối chiếu. Ba điểm kia đều là chỗ lệch trong bài (tr. 248–251)."}], "gloss": [{"term": "Tổng quan hệ thống (systematic review)", "mean": "Tìm kiếm, chọn lọc và đánh giá có hệ thống tất cả nghiên cứu phù hợp theo quy trình định trước", "page": "246"}, {"term": "Gộp phân tích (meta-analysis)", "mean": "Phương pháp thống kê gộp kết quả nhiều nghiên cứu thành một ước lượng chung", "page": "246"}, {"term": "PRISMA 2020", "mean": "Bảng kiểm và lưu đồ báo cáo cho tổng quan hệ thống", "page": "248"}, {"term": "PROSPERO", "mean": "Cơ sở dữ liệu đăng ký trước đề cương tổng quan hệ thống", "page": "246"}, {"term": "Mô hình hiệu ứng ngẫu nhiên (random-effects)", "mean": "Giả định hiệu quả thật khác nhau giữa các nghiên cứu; trọng số tính cả phương sai giữa các nghiên cứu", "page": "248"}, {"term": "Mantel–Haenszel", "mean": "Cách tính trọng số khi gộp tỉ số nguy cơ, phù hợp biến cố hiếm", "page": "248"}, {"term": "Nguy cơ tương đối (RR)", "mean": "Tỉ số nguy cơ nhóm can thiệp trên nhóm đối chứng; RR dưới 1 nghĩa là ít biến cố hơn", "page": "246"}, {"term": "I²", "mean": "Tỉ lệ biến thiên giữa các nghiên cứu không do ngẫu nhiên; càng cao càng không đồng nhất", "page": "248"}, {"term": "RoB 2", "mean": "Công cụ Cochrane đánh giá nguy cơ sai lệch của RCT qua 5 miền", "page": "247"}, {"term": "GRADE", "mean": "Hệ thống đánh giá độ chắc chắn của bằng chứng (cao, trung bình, thấp, rất thấp) theo từng kết cục", "page": "251"}, {"term": "Phân tích loại từng nghiên cứu (leave-one-out)", "mean": "Lặp lại gộp phân tích sau khi bỏ lần lượt từng nghiên cứu để xem một nghiên cứu ảnh hưởng thế nào", "page": "248"}, {"term": "Biểu đồ phễu (funnel plot)", "mean": "Biểu đồ phát hiện sai lệch công bố; cần đủ nhiều nghiên cứu (thường từ 10)", "page": "248"}, {"term": "Viêm nội mạc tử cung (endometritis)", "mean": "Nhiễm khuẩn lớp niêm mạc tử cung sau sinh", "page": "249"}, {"term": "Viêm màng ối (chorioamnionitis)", "mean": "Nhiễm khuẩn màng ối và thai trong chuyển dạ", "page": "249"}], "val": [{"item": "Azithromycin liều đơn 1–2 g đường uống hoặc 500 mg tĩnh mạch trong chuyển dạ có nằm trong danh mục thuốc của bệnh viện không; chỉ định đã đăng ký tại Việt Nam có bao gồm dự phòng nhiễm khuẩn sau sinh không (nếu không, đây là dùng ngoài chỉ định đã đăng ký, off-label)", "ref": "3"}, {"item": "Phác đồ dự phòng kháng sinh hiện hành của bệnh viện cho mổ lấy thai và cho sinh đường âm đạo có nguy cơ (thuốc, liều, thời điểm); so với khuyến cáo WHO và ACOG được bài trích (tài liệu 4 và 9 của bài)", "ref": "4, 9"}, {"item": "Tính tương đồng về quần thể: tỉ lệ mổ lấy thai không chủ động, nguy cơ nền nhiễm khuẩn huyết mẹ tại BVĐK Phương Nam so với 1,7% (giả dược) trong bài. Bằng chứng chủ yếu từ nước thu nhập thấp và trung bình, tác giả lưu ý kết quả có thể không áp dụng rộng", "ref": "1, 8"}, {"item": "Nguy cơ đề kháng macrolid và quản lý kháng sinh (antibiotic stewardship): tác giả đề xuất nhắm vào nhóm nguy cơ cao (ví dụ mổ không chủ động) thay vì dùng rộng; cần ý kiến Hội đồng Thuốc và Điều trị", "ref": "4"}, {"item": "An toàn: nôn nhiều hơn (Roca 2023: 10,1% so với 6,1%), nguy cơ kéo dài khoảng QT và tương tác thuốc; hẹp môn vị ở trẻ (8 so với 3 ca, chưa đủ lực mẫu). Đối chiếu nhãn thuốc và tờ hướng dẫn sử dụng", "ref": "5"}, {"item": "Đối chiếu dữ liệu A-PLUS và C/SOAP gốc cho các nhận định về nhóm con (khu vực, đường sinh), vì tổng quan này chưa phân nhóm theo đường sinh được", "ref": "2, 3"}, {"item": "Kiểm tra bằng chứng công bố sau 3/2023 và phụ lục của bài (Hình S1–S6, Bảng S1) trước khi đưa vào quy trình hay đề xuất thay đổi phác đồ", "ref": "1"}], "inc": [{"t": "Số nghiên cứu và cỡ mẫu của tử vong mẹ", "a": "Tr. 249 (Kết quả): 'Five studies' phân tích tử vong; nhiễm khuẩn huyết mẹ cũng 5 nghiên cứu (44.190)", "b": "Tr. 250 (Hình 3) và tr. 251 (Bảng 2): tử vong mẹ chỉ 3 nghiên cứu (Roca, Subramaniam, Tita 2023), 20.581 + 20.708 = 41.289 sản phụ", "note": "Hình 3 và Bảng 2 khớp nhau và khớp phép cộng; văn bản có vẻ ghi nhầm số nghiên cứu. Chưa kết luận, cần đối chiếu bản gốc."}, {"t": "Độ chắc chắn bằng chứng cho kết cục sơ sinh", "a": "Tr. 251 (Bảng 2) và Tóm tắt: tử vong và nhiễm khuẩn huyết sơ sinh 'trung bình', hạ bậc do nguy cơ sai lệch", "b": "Tr. 251 (Thảo luận 4.1): 'high-quality evidence' không giảm tử vong và nhiễm khuẩn huyết nghi ngờ sơ sinh; tr. 253 (Điểm mạnh và hạn chế): chất lượng các nghiên cứu được đưa vào là điểm mạnh chính (4/5 nguy cơ thấp)", "note": "Hai cách diễn đạt khác mức độ chắc chắn. Hơn nữa Bảng 2 hạ bậc 'do nguy cơ sai lệch' trong khi Hình 2 cho thấy chỉ một nghiên cứu có lo ngại."}, {"t": "Mô tả nguy cơ sai lệch của các RCT", "a": "Tr. 248 (Kết quả, câu đầu): 'risk of bias was low in all studies'", "b": "Tr. 248 (câu sau) và tr. 249 (Hình 2): thấp ở 4 nghiên cứu, có một số lo ngại ở Oluwalana 2017 (miền D5)", "note": "Hai câu liền nhau mâu thuẫn; hình và Tóm tắt khớp 'thấp ở 4, có lo ngại ở 1'."}, {"t": "Số người của A-PLUS và tổng số", "a": "Tr. 249 (Bảng 1): Tita 2023 có 29.163 người; tổng Bảng 1 = 44.133", "b": "Tr. 250 (Hình 3, nhiễm khuẩn huyết mẹ): 14.558 + 14.662 = 29.220; tổng 22.047 + 22.143 = 44.190 (khớp văn bản)", "note": "Chênh 57 người, có thể do số người phân tích khác số người ghi danh. Cần đối chiếu A-PLUS gốc."}, {"t": "Khoảng tỉ lệ mổ lấy thai không chủ động", "a": "Tr. 248: 'Non-elective caesarean delivery rate varied between 1.8% and 33%'", "b": "Tr. 249 (Bảng 1): Tita 2016 100% mổ không chủ động (2.013 người)", "note": "Khoảng 1,8–33% có vẻ không tính nghiên cứu chỉ mổ lấy thai; cách nói dễ gây hiểu nhầm."}, {"t": "Hiệu ứng tuyệt đối của nhiễm khuẩn vết mổ và nhiễm khuẩn huyết sơ sinh", "a": "Tr. 251 (Bảng 2): nhiễm khuẩn vết mổ 16 so với 25 trên 1000 (chênh 9) nhưng ghi '12 fewer per 1000 (18 to 3)'; nhiễm khuẩn huyết sơ sinh 76 so với 74 trên 1000 nhưng ghi '1 fewer per 1000 (3 fewer to 7 more)'", "b": "RR gộp 0,52 và 1,02 áp lên nguy cơ giả dược 25 và 74 trên 1000 cho 12 ca ít hơn và 1,5 ca nhiều hơn", "note": "Hiệu ứng tuyệt đối trong Bảng 2 tính từ RR gộp nên khác phép trừ nguy cơ thô là bình thường. Riêng '1 fewer' cho RR 1,02 (hướng nhiều hơn) có vẻ là lỗi đánh máy."}, {"t": "Tên nghiên cứu và số bảng được dẫn", "a": "Tr. 249 (Hình 2): 'Roca et al. (2013)'; tr. 249 (Kết quả): độ chắc chắn 'Table 1'", "b": "Tr. 249 (Bảng 1) và Hình 3: 'Roca 2023'; độ chắc chắn nằm ở Bảng 2 (tr. 251)", "note": "Lỗi trình bày, không ảnh hưởng số liệu; dùng để xác nhận cần dựa vào Hình 3 và 4 cho số liệu."}, {"t": "Diễn giải tử vong mẹ trong Kết luận", "a": "Tr. 253 (Kết luận): tử vong mẹ 'showed both clear benefit and substantial harm'", "b": "Tr. 250 (Hình 3): RR 1,26 (95% CI 0,65–2,42); 20 so với 16 ca; không có ý nghĩa", "note": "Khoảng tin cậy rộng chứa cả lợi ích và tác hại nên chỉ cho thấy chưa kết luận được; cụm 'clear benefit' và 'substantial harm' không được số liệu hỗ trợ."}, {"t": "Phần trăm tử vong mẹ", "a": "Tr. 249: 0,09% so với 0,08%", "b": "Tr. 250 (Hình 3): 20/20.581 = 0,097% và 16/20.708 = 0,077%", "note": "Chênh nhỏ do làm tròn xuống thay vì làm tròn lên (0,10%)."}, {"t": "Số tài liệu dẫn cho kết cục sơ sinh", "a": "Tr. 250 (mục 3.2): 'Neonatal death was assessed in five studies' dẫn tài liệu 2–6; nhiễm khuẩn huyết sơ sinh cũng dẫn 2–6", "b": "Tr. 248 (mục 3) và tr. 254: năm RCT được đưa vào là tài liệu 5, 6, 7, 11, 12; tài liệu 2–4 là GBD, Cochrane, WHO (không phải RCT)", "note": "Có vẻ là lỗi dẫn số tài liệu, không ảnh hưởng số liệu ở Hình 4. Chưa kết luận, cần đối chiếu bản gốc."}]}</script>

function calcRR(){var e1=num("cE1"),n1=num("cN1"),e2=num("cE2"),n2=num("cN2"),o=$("rrOut");
 var ok=[e1,n1,e2,n2].every(function(v){return isFinite(v)&&v>=0&&Math.floor(v)===v;})&&n1>0&&n2>0&&e1<=n1&&e2<=n2;

 o.innerHTML='<div class="est"><div>'+f1(p1*100)+'% so với '+f1(p2*100)+'%<small>'+e1+'/'+n1+' so với '+e2+'/'+n2+'</small></div><div>RR '+f2(p1/p2)+'<small>'+esc(A.la)+' / '+esc(A.lb)+'</small></div><div>ARR '+f1(arr*100)+' điểm %<small>nguy cơ '+esc(A.lb)+' trừ '+esc(A.la)+'</small></div>'+nnt+'</div><p class="note">Số tính lại, làm tròn một chữ số thập phân; có thể lệch nhẹ so với số bài báo cáo (xem mục Điểm cần đối chiếu trong bài).</p>';}

 var p0=b/100,p1=p0*r,arr=p0-p1;if(arr<=0){o.innerHTML='<div class="warnx">RR từ 1 trở lên: không có giảm nguy cơ tuyệt đối, NNT không xác định.</div>';return;}

function p5(){var h='<div class="card"><h2>Công cụ tính <span class="ai">AI soạn</span></h2><p class="sub">Chỉ làm phép tính số học. Không lưu dữ liệu người bệnh; nhập số giả định hoặc đã ẩn danh. Không thay thế đánh giá lâm sàng.</p><div class="grid g2">'+
 '<div class="mini"><h3>Tính lại RR, ARR và NNT từ số biến cố</h3><p class="note">Mặc định là '+esc(C.what)+' ('+C.e1+'/'+C.n1+' và '+C.e2+'/'+C.n2+'). Không tính khoảng tin cậy; xem khoảng tin cậy trong bài.</p><div class="form"><label>Biến cố, '+esc(A.la)+'<input id="cE1" type="number" min="0" step="1" value="'+C.e1+'"></label><label>Cỡ mẫu, '+esc(A.la)+'<input id="cN1" type="number" min="1" step="1" value="'+C.n1+'"></label><label>Biến cố, '+esc(A.lb)+'<input id="cE2" type="number" min="0" step="1" value="'+C.e2+'"></label><label>Cỡ mẫu, '+esc(A.lb)+'<input id="cN2" type="number" min="1" step="1" value="'+C.n2+'"></label></div><div id="rrOut" aria-live="polite"></div></div>'+
 '<div class="mini"><h3>NNT theo nguy cơ nền khác <span class="ai">ngoại suy</span></h3><p class="note">Giả định RR không đổi ở mọi mức nguy cơ nền. Bài đo ở nguy cơ nền '+esc(C.base_txt||vn(String(C.base)))+'% (nhóm '+esc(A.lb)+'). Con số này không nằm trong bài.</p><div class="form"><label>Nguy cơ nền khi chỉ có dự phòng chuẩn (%)<input id="bl" type="number" min="0.1" max="100" step="0.1" value="'+C.base+'"></label><label>RR áp dụng<input id="rr" type="number" min="0.05" max="2" step="0.01" value="'+C.rr+'"></label></div><div id="nnOut" aria-live="polite"></div></div></div></div>';
 h+='<div class="card"><h2>Tình huống minh họa <span class="ai">AI soạn</span></h2><p class="sub">'+esc(R.ai_note_cases)+'</p>'+R.cases.map(function(c){return '<details class="case"><summary>'+esc(c.t)+'</summary><table><tbody>'+c.rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join("")+'</tbody></table></details>';}).join("")+'</div>';
 h+='<div class="card"><h2>Trắc nghiệm <span class="ai">AI soạn</span></h2><p class="sub">'+D.quiz.length+' câu, giải thích có dẫn trang.</p><div id="quiz"></div><p class="note" id="qscore" aria-live="polite"></p></div>';
 $("p5").innerHTML=h;
 ["cE1","cN1","cE2","cN2"].forEach(function(i){$(i).addEventListener("input",calcRR);});["bl","rr"].forEach(function(i){$(i).addEventListener("input",calcNN);});calcRR();calcNN();
 var done=0,score=0;
 $("quiz").innerHTML=D.quiz.map(function(q,qi){return '<div class="q" data-q="'+qi+'"><p>'+(qi+1)+'. '+esc(q.q)+'</p>'+q.o.map(function(o,oi){return '<button type="button" class="opt" data-o="'+oi+'">'+esc(o)+'</button>';}).join("")+'<div class="ex" hidden></div></div>';}).join("");
 [].forEach.call(document.querySelectorAll("#quiz .q"),function(box){var qi=+box.getAttribute("data-q"),q=D.quiz[qi];[].forEach.call(box.querySelectorAll(".opt"),function(b){b.addEventListener("click",function(){
  var oi=+b.getAttribute("data-o");[].forEach.call(box.querySelectorAll(".opt"),function(x,xi){x.disabled=true;if(xi===q.a){x.classList.add("ok");x.textContent="✓ "+x.textContent;}else if(xi===oi){x.classList.add("no");x.textContent="✗ "+x.textContent;}});
  var ex=box.querySelector(".ex");ex.hidden=false;ex.textContent=(oi===q.a?"Đúng. ":"Chưa đúng. ")+q.e;done++;if(oi===q.a)score++;if(done===D.quiz.length)$("qscore").textContent="Điểm: "+score+" / "+D.quiz.length;});});});}
